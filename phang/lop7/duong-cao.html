<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đường cao – Trực tâm</title>
<link rel="stylesheet" href="../../chung/giao-dien.css">
<link rel="stylesheet" href="../../chung/khung-3d.css">
<link rel="stylesheet" href="../../chung/khung-phang.css">
<script src="../../chung/cau-hinh.js"></script>
<script src="../../chung/dang-nhap.js" data-goc="../../"></script>
</head>
<body>
<div id="thanh-tren"></div>
<div id="mo-hinh"></div>

<script src="../../chung/thanh-chia.js"></script>
<script src="../../chung/khung-phang.js"></script>
<script>
/* =====================================================================
   ĐƯỜNG CAO – TRỰC TÂM — Toán 7
   Kéo A, B, C hoặc chọn nhanh tam giác nhọn / vuông / tù.
   AD, BE, CF là ba đường cao; H là trực tâm.
   ===================================================================== */
var H = KhungPhang.H, so = KhungPhang.so, M = KhungPhang.MAU;
var MAU_T = { AD: '#E0342F', BE: '#1E6FE0', CF: '#16A34A' }, MH = '#C026D3';
function dc(P) {
  var A = P.A, B = P.B, C = P.C;
  function mot(id, V, X, Y, ten) {
    var K = H.chan(V, X, Y), L2 = Math.pow(H.dai(X, Y), 2);
    var t = ((K[0] - X[0]) * (Y[0] - X[0]) + (K[1] - X[1]) * (Y[1] - X[1])) / L2;
    return { id: id, dinh: V, chan: K, ten: ten, X: X, Y: Y, t: t };
  }
  return { A: A, B: B, C: C, Ht: H.trucTam(A, B, C), ds: [mot('AD', A, B, C, 'D'), mot('BE', B, C, A, 'E'), mot('CF', C, A, B, 'F')] };
}
function loai(P) {
  var mx = Math.max(H.gocDo(P.B, P.A, P.C), H.gocDo(P.A, P.B, P.C), H.gocDo(P.A, P.C, P.B));
  return Math.abs(mx - 90) < 0.05 ? 'vuong' : mx > 90 ? 'tu' : 'nhon';
}
function veMot(g, d, o) {   // vẽ đường cao d: đoạn đỉnh–chân, kéo dài cạnh nếu chân nằm ngoài, ký hiệu góc vuông
  if (H.dai(d.dinh, d.chan) < 1e-6) return;
  if (d.t < 0) g.doan(d.chan, d.X, { mau: '#94A3B8', dut: '5 4', rong: 1.6 });
  if (d.t > 1) g.doan(d.chan, d.Y, { mau: '#94A3B8', dut: '5 4', rong: 1.6 });
  g.doan(d.dinh, d.chan, o);
  var ref = H.dai(d.chan, d.Y) > 1e-6 ? d.Y : d.X;
  g.goc(d.dinh, d.chan, ref, { mau: o.mauGoc, r: 12, to: false });
}
function datHinh(A, B, C) { return function (P, ts, api) { P.A = A; P.B = B; P.C = C; api.vuaKhung(); }; }

/* ---------- Vẽ đường cao bằng thước và ê ke ---------- */
var DG = KhungPhang.dung;
// Các bước vẽ đường cao d (từ đỉnh d.dinh xuống đường thẳng XY) bằng ê ke
function buocEke(d, so, tenCanh) {
  var V = d.dinh, K = d.chan, X = d.X, Y = d.Y, mau = MAU_T[d.id], ds = [];
  var hV = H.dai(V, K); if (hV < 1e-6) return ds;
  // cạnh góc vuông thứ nhất nằm trên XY, hướng về đầu mút xa chân đường cao hơn (ê ke nằm gọn trong tam giác)
  var Q = H.dai(K, X) > H.dai(K, Y) ? X : Y;
  var a0 = H.huong(K, Q), u = [Math.cos(a0), Math.sin(a0)];
  var dau = (u[0] * (V[1] - K[1]) - u[1] * (V[0] - K[0])) >= 0 ? 1 : -1;
  var L = Math.max(2.6, hV + 0.9), dich = 2.4;
  var ngoai = d.t < 0 ? X : d.t > 1 ? Y : null;
  if (ngoai) ds.push(DG.doan(ngoai, H.cong(K, H.nhan(H.tru(K, ngoai), 0.6 / Math.max(1e-6, H.dai(K, ngoai)))), { tg: 1,
    ghi: '<b>Bước ' + so + '.</b> Chân đường cao nằm ngoài cạnh $' + tenCanh + '$: dùng thước <b>kéo dài</b> cạnh $' + tenCanh + '$.', net: { mau: '#94A3B8', rong: 1.6, dut: '5 4' } }));
  ds.push({ tg: 2, ghi: (ngoai ? '' : '<b>Bước ' + so + '.</b> ') + 'Đặt một cạnh góc vuông của ê ke <b>nằm trên đường thẳng $' + tenCanh + '$</b>, trượt ê ke cho đến khi cạnh góc vuông còn lại <b>đi qua $' + d.dinh.ten + '$</b>.',
    cu: function (g, e) { var k = 1 - H.doan(e, 0, 0.85); g.eke(H.cong(K, H.nhan(u, dich * k)), a0, dau, { loai: 'vuong', dai: L, doMo: 0.45 + 0.5 * Math.min(1, e * 2) }); } });
  ds.push({ tg: 1.3, ghi: 'Giữ ê ke, kẻ theo cạnh góc vuông từ $' + d.dinh.ten + '$ xuống tới $' + tenCanh + '$, được chân đường cao $' + d.ten + '$.',
    ve: function (g, e) { g.doan(V, H.lerp(V, K, e), { mau: mau, rong: 4 }); },
    xong: function (g) { veMot(g, d, { mau: mau, rong: 4, mauGoc: mau }); g.diem(K, d.ten, { r: 4, mau: mau, huong: H.tru(K, V) }); },
    cu: function (g, e) { g.eke(K, a0, dau, { loai: 'vuong', dai: L }); g.but(H.lerp(V, K, e)); } });
  return ds;
}
function kbAD(P) {
  var q = dc(P); q.ds[0].dinh = Object.assign(P.A.slice(), { ten: 'A' });
  return KhungPhang.kichBan(buocEke(q.ds[0], 1, 'BC').concat([
    DG.hien(function () {}, { tg: 1, ghi: '$AD \\perp BC$ tại $D$: $AD$ là <b>đường cao</b> của tam giác $ABC$ xuất phát từ đỉnh $A$.' }),
  ]));
}
function kbTrucTam(P) {
  var q = dc(P), Ht = q.Ht, d1 = q.ds[0], d2 = q.ds[1];
  d1.dinh = Object.assign(P.A.slice(), { ten: 'A' }); d2.dinh = Object.assign(P.B.slice(), { ten: 'B' });
  var ds = buocEke(d1, 1, 'BC').concat(buocEke(d2, 2, 'CA'));
  // tam giác tù: kéo dài hai đường cao cho đến khi chúng cắt nhau
  [d1, d2].forEach(function (d) {
    var v = H.tru(d.chan, d.dinh), L2 = v[0] * v[0] + v[1] * v[1]; if (L2 < 1e-9) return;
    var tH = ((Ht[0] - d.dinh[0]) * v[0] + (Ht[1] - d.dinh[1]) * v[1]) / L2;
    if (tH > 1.001) ds.push(DG.doan(d.chan, Ht, { tg: 0.9, ghi: 'Hai đường cao chưa cắt nhau: dùng thước <b>kéo dài</b> chúng (nét đứt).', net: { mau: MAU_T[d.id], rong: 1.8, dut: '4 4' } }));
    if (tH < -0.001) ds.push(DG.doan(d.dinh, Ht, { tg: 0.9, ghi: 'Hai đường cao chưa cắt nhau: dùng thước <b>kéo dài</b> chúng (nét đứt).', net: { mau: MAU_T[d.id], rong: 1.8, dut: '4 4' } }));
  });
  ds.push(DG.hien(function (g) { g.diem(Ht, 'H', { r: 6, mau: MH, huong: [0.9, 0.6] }); }, { tg: 1.4,
    ghi: '<b>Bước 3.</b> Hai đường cao $AD$ và $BE$ cắt nhau tại $H$: $H$ là <b>trực tâm</b> của tam giác $ABC$.' }));
  var d3 = q.ds[2];
  if (H.dai(d3.dinh, d3.chan) > 1e-6) ds.push({ tg: 1.6, ghi: '<b>Kiểm tra:</b> đường cao thứ ba $CF$ cũng đi qua $H$ — ba đường cao cùng đi qua một điểm, nên chỉ cần vẽ <b>hai</b> đường cao là xác định được trực tâm.',
    ve: function (g, e) { g.doan(d3.dinh, H.lerp(d3.dinh, d3.chan, e), { mau: MAU_T.CF, rong: 2.4, dut: '7 5' }); },
    xong: function (g) { veMot(g, d3, { mau: MAU_T.CF, rong: 2.4, dut: '7 5', mauGoc: MAU_T.CF }); g.diem(d3.chan, 'F', { r: 3.5, mau: MAU_T.CF, huong: H.tru(d3.chan, d3.dinh) });
      var v = H.tru(d3.chan, d3.dinh), L2 = v[0] * v[0] + v[1] * v[1], tH = ((Ht[0] - d3.dinh[0]) * v[0] + (Ht[1] - d3.dinh[1]) * v[1]) / L2;
      if (tH > 1.001) g.doan(d3.chan, Ht, { mau: MAU_T.CF, dut: '4 4', rong: 1.8 }); if (tH < -0.001) g.doan(d3.dinh, Ht, { mau: MAU_T.CF, dut: '4 4', rong: 1.8 });
      g.diem(Ht, 'H', { r: 6, mau: MH, huong: [0.9, 0.6] }); } });
  return KhungPhang.kichBan(ds);
}

KhungPhang.tao({
  ten: 'Đường cao – Trực tâm',
  lop: 7,
  diem: { A: [-1, 5], B: [-4, 0], C: [4.5, 0] },
  nhapGoc: KhungPhang.goc.dsTamGiac(['B', 'C', 'A'], ['A', 'B', 'C']),
  buocLuoi: 0.5,
  batDau: ['AD'],
  tieuDeNutPhu: 'Chọn nhanh loại tam giác',
  nutPhu: [
    { nhan: 'Tam giác nhọn', bam: datHinh([-1, 5], [-4, 0], [4.5, 0]) },
    { nhan: 'Tam giác vuông', bam: datHinh([-4, 4], [-4, 0], [4, 0]) },
    { nhan: 'Tam giác tù', bam: datHinh([-6, 3.5], [-4, 0], [4, 0]) },
  ],

  lamSang: [
    { id: 'AD', nhan: 'Đường cao AD', mau: MAU_T.AD, ghiChu: '$AD$ vuông góc với đường thẳng $BC$ tại $D$: $AD$ là <b>đường cao</b> xuất phát từ đỉnh $A$.' },
    { id: 'BE', nhan: 'Đường cao BE', mau: MAU_T.BE, ghiChu: '$BE$ vuông góc với đường thẳng $CA$ tại $E$: $BE$ là đường cao xuất phát từ đỉnh $B$.' },
    { id: 'CF', nhan: 'Đường cao CF', mau: MAU_T.CF, ghiChu: '$CF$ vuông góc với đường thẳng $AB$ tại $F$: $CF$ là đường cao xuất phát từ đỉnh $C$.' },
    { id: 'Ht', nhan: 'Trực tâm H', mau: MH,
      ghiChu: function (P) {
        var l = loai(P);
        return 'Ba đường cao của một tam giác <b>cùng đi qua một điểm</b> $H$, gọi là <b>trực tâm</b>. ' +
          (l === 'nhon' ? 'Tam giác nhọn: $H$ nằm <b>bên trong</b> tam giác.' : l === 'vuong' ? 'Tam giác vuông: $H$ <b>trùng với đỉnh góc vuông</b>.' : 'Tam giác tù: $H$ nằm <b>bên ngoài</b> tam giác (các đường cao phải kéo dài – nét đứt).');
      } },
  ],

  hoatHinh: [
    { id: 'eke', nhan: 'Vẽ đường cao AD bằng ê ke', anDiem: true,
      thoiGian: function (P) { return kbAD(P).tong * 1000; }, ghiChu: function (P, ts, t) { return kbAD(P).ghi(t); } },
    { id: 'trucTam', nhan: 'Vẽ hai đường cao, xác định trực tâm H', anDiem: true,
      thoiGian: function (P) { return kbTrucTam(P).tong * 1000; }, ghiChu: function (P, ts, t) { return kbTrucTam(P).ghi(t); } },
  ],

  ve: function (g, P) {
    var q = dc(P), A = q.A, B = q.B, C = q.C, Ht = q.Ht, te = g.hoat('eke');
    g.daGiac([A, B, C], { to: '#93C5FD', doMoTo: 0.22, rong: 2.8 });
    function nhan() { g.diem(A, 'A', { huong: H.tru(A, H.trongTam(A, B, C)) }); g.diem(B, 'B', { huong: H.tru(B, H.trongTam(A, B, C)) }); g.diem(C, 'C', { huong: H.tru(C, H.trongTam(A, B, C)) }); }

    var tt = g.hoat('trucTam');
    if (te !== null) { kbAD(P).ve(g, te); nhan(); return; }
    if (tt !== null) { kbTrucTam(P).ve(g, tt); nhan(); return; }

    var onH = g.bat('Ht');
    q.ds.forEach(function (d) {
      var on = g.bat(d.id);
      if (!on && !onH) return;
      veMot(g, d, on ? { sang: d.id, mauGoc: MAU_T[d.id] } : { mau: MAU_T[d.id], rong: 2, mauGoc: MAU_T[d.id] });
      if (H.dai(d.dinh, d.chan) > 1e-6) g.diem(d.chan, d.ten, { r: 3.5, mau: MAU_T[d.id], huong: H.tru(d.chan, d.dinh) });
      if (onH && Ht) {   // kéo dài đường cao tới trực tâm nếu cần
        var v = H.tru(d.chan, d.dinh), L2 = v[0] * v[0] + v[1] * v[1];
        if (L2 > 1e-9) {
          var tH = ((Ht[0] - d.dinh[0]) * v[0] + (Ht[1] - d.dinh[1]) * v[1]) / L2;
          if (tH > 1.001) g.doan(d.chan, Ht, { mau: MAU_T[d.id], dut: '4 4', rong: 1.8 });
          if (tH < -0.001) g.doan(d.dinh, Ht, { mau: MAU_T[d.id], dut: '4 4', rong: 1.8 });
        }
      }
    });
    if (onH && Ht) g.diem(Ht, 'H', { r: 6, mau: MH, huong: [0.9, 0.6] });
    nhan();
  },

  nhanXet: function (P) {
    var l = loai(P);
    return 'Đây là <b>tam giác ' + (l === 'nhon' ? 'nhọn' : l === 'vuong' ? 'vuông' : 'tù') + '</b>.<br>' +
      (l === 'nhon' ? 'Trực tâm $H$ nằm <b>trong</b> tam giác.' : l === 'vuong' ? 'Trực tâm $H$ <b>trùng đỉnh góc vuông</b>; hai cạnh góc vuông cũng là hai đường cao.' : 'Trực tâm $H$ nằm <b>ngoài</b> tam giác.') +
      '<br><span class="dung">Kéo các đỉnh hoặc chọn nhanh loại tam giác để so sánh.</span>';
  },
  congThuc: function (P, ts, C) { return [{ id: 'AD', ten: 'Đường cao', bt: '$' + C.m('AD', 'AD \\perp BC') + '$ ; $' + C.m('BE', 'BE \\perp CA') + '$ ; $' + C.m('CF', 'CF \\perp AB') + '$' }]; },
  khungNhin: function (P) { var Ht = H.trucTam(P.A, P.B, P.C), top = Math.max(P.A[1], P.B[1], P.C[1]), ds = [[P.A[0], top + 1.5]]; if (Ht && H.dai(Ht, H.trongTam(P.A, P.B, P.C)) < 15) ds.push(Ht); return ds; },
});
</script>
</body>
