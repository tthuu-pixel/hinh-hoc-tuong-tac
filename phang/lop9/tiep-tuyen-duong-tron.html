<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiếp tuyến của đường tròn</title>
<link rel="stylesheet" href="../../chung/giao-dien.css">
<link rel="stylesheet" href="../../chung/khung-3d.css">
<link rel="stylesheet" href="../../chung/khung-phang.css">
<script src="../../chung/cau-hinh.js"></script>
<script src="../../chung/dang-nhap.js" data-goc="../../"></script>
</head>
<body>
<div id="thanh-tren"></div>
<div id="mo-hinh"></div>

<script src="../../chung/thanh-chia.js"></script>
<script src="../../chung/khung-phang.js"></script>
<script>
/* =====================================================================
   TIẾP TUYẾN CỦA ĐƯỜNG TRÒN — Toán 9
   Tính chất: tiếp tuyến vuông góc với bán kính tại tiếp điểm;
   khoảng cách từ tâm O đến tiếp tuyến bằng bán kính R.
   Cách vẽ bằng thước thẳng và ê ke: (1) tại một điểm M trên đường tròn;
   (2) từ một điểm M ở ngoài đường tròn.
   ===================================================================== */
var H = KhungPhang.H, so = KhungPhang.so, soL = KhungPhang.soL, D = KhungPhang.dung;
var O0 = [0, 0], R = 2.5, RAD = Math.PI / 180;
var MT = '#1E6FE0', MV = '#16A34A', MR = '#E0342F', MN = '#7C3AED';
function diemDT(a) { return [R * Math.cos(a), R * Math.sin(a)]; }
function lenDT(p) { var d = H.dai(p, O0); if (d < 1e-6) return null; var a = Math.round(Math.atan2(p[1], p[0]) / RAD) * RAD; return diemDT(a); }
function laTren(P, ts) { return ts.che === 'tren'; }
function laNgoai(P, ts) { return ts.che === 'ngoai'; }
function keo(M, X, k) { return H.cong(M, H.nhan(H.tru(X, M), 1 + k / H.dai(M, X))); }

// Trường hợp 1: tiếp tuyến tại điểm M trên đường tròn (trong mã là P.A)
function tai(A) {
  var u = H.nhan(A, 1 / R), v = [-u[1], u[0]], L = 3.6;
  return { A: A, u: u, v: v, d1: H.cong(A, H.nhan(v, L)), d2: H.cong(A, H.nhan(v, -L)) };
}
// Trường hợp 2: hai tiếp tuyến kẻ từ M ở ngoài đường tròn
function tu(M) {
  var d = H.dai(M, O0), th = Math.atan2(M[1], M[0]), ph = Math.acos(R / d);
  return { M: M, d: d, A: diemDT(th + ph), B: diemDT(th - ph), dai: Math.sqrt(d * d - R * R) };
}

/* ---------- Bước cuối chung: kí hiệu vuông góc ---------- */
function buocVuong(ds, ghi) {
  // ds: [{ T: tiếp điểm, X: điểm trên tiếp tuyến }]
  return [D.hien(function (g) { ds.forEach(function (o) { g.doan(O0, o.T, { mau: MV, rong: 2.4 }); g.goc(O0, o.T, o.X, { mau: MV, r: 13 }); }); }, { tg: 1.8, ghi: ghi })];
}

/* ---------- Ê ke: đỉnh góc vuông tại K, cạnh thứ nhất theo hướng a0, cạnh thứ hai về phía điểm X ---------- */
function dauEke(a0, K, X) { return (Math.cos(a0) * (X[1] - K[1]) - Math.sin(a0) * (X[0] - K[0])) >= 0 ? 1 : -1; }

/* ---------- Cách vẽ 1: tiếp tuyến tại điểm M trên đường tròn (ê ke và thước thẳng) ---------- */
function kbTai(P) {
  var q = tai(P.A), M = q.A, u = q.u, v = q.v, BEN = 1;   // thân thước thẳng nằm phía ngoài đường tròn
  var ngan = 1.5, S1 = H.cong(M, H.nhan(v, ngan));        // đoạn vuông góc ngắn kẻ theo ê ke
  var a0 = H.huong(M, O0), dau = dauEke(a0, M, S1), LE = 2;
  var net = { mau: MT, rong: 3.5 };
  function chamM(g) { g.diem(M, 'M', { huong: H.cong(H.nhan(u, 0.6), H.nhan(v, -1)) }); }
  return KhungPhang.kichBan([
    { tg: 1, ghi: '<b>Bước 1.</b> Bút chấm điểm $M$ trên đường tròn $(O)$.', ve: chamM, xong: chamM, cu: function (g) { g.but(M); } },
    D.doan(O0, M, { ghi: '<b>Bước 2.</b> Dùng thước nối $O$ với $M$.', net: { mau: MV, rong: 2.4 }, sau: chamM }),
    { tg: 2, ghi: '<b>Bước 3.</b> Đặt <b>ê ke</b>: một cạnh góc vuông nằm trên $OM$, trượt ê ke cho tới khi <b>đỉnh góc vuông trùng với $M$</b>.',
      cu: function (g, e) { var K = H.cong(M, H.nhan(u, 1.6 * (1 - H.doan(e, 0, 0.85)))); g.eke(K, a0, dau, { loai: 'vuong', dai: LE, doMo: 0.4 + 0.55 * Math.min(1, e * 2) }); } },
    { tg: 1.2, ghi: 'Kẻ một <b>đoạn vuông góc ngắn</b> theo cạnh góc vuông còn lại của ê ke.',
      ve: function (g, e) { g.doan(M, H.lerp(M, S1, e), net); },
      xong: function (g) { g.doan(M, S1, net); },
      cu: function (g, e) { g.eke(M, a0, dau, { loai: 'vuong', dai: LE }); g.but(H.lerp(M, S1, e)); } },
    { tg: 1.4, ghi: 'Cất ê ke, đặt <b>thước thẳng</b> dọc theo đoạn vừa kẻ.',
      cu: function (g, e) { var d = H.nhan(u, 1.2 * (1 - H.doan(e, 0, 0.8))); g.thuoc(H.cong(q.d2, d), H.cong(q.d1, d), { ben: BEN, doMo: 0.4 + 0.55 * Math.min(1, e * 1.5) }); } },
    { tg: 1.8, ghi: 'Dùng thước thẳng <b>kéo dài</b> đoạn vuông góc về hai phía: được tiếp tuyến $d$ của $(O)$ tại $M$.',
      ve: function (g, e) { var k1 = H.doan(e, 0, 0.5), k2 = H.doan(e, 0.5, 1); g.doan(M, S1, net); g.doan(S1, H.lerp(S1, q.d1, k1), net); if (k2 > 0) g.doan(M, H.lerp(M, q.d2, k2), net); },
      xong: function (g) { g.doan(q.d2, q.d1, net); g.chu(H.cong(q.d1, H.nhan(v, 0.35)), 'd', { mau: MT, nghieng: true }); },
      cu: function (g, e) { g.thuoc(q.d2, q.d1, { ben: BEN }); g.but(e < 0.5 ? H.lerp(S1, q.d1, H.doan(e, 0, 0.5)) : H.lerp(M, q.d2, H.doan(e, 0.5, 1))); } },
  ].concat(buocVuong([{ T: M, X: q.d1 }], '<b>Bước 4.</b> Kí hiệu góc vuông: $d \\perp OM$ tại $M$. Đường thẳng đi qua $M$ và vuông góc với bán kính $OM$ là <b>tiếp tuyến</b>.')));
}

/* ---------- Cách vẽ 2: từ M ở ngoài (thước thẳng, ê ke xác định tiếp điểm) ---------- */
function kbThuoc(P) {
  var q = tu(P.M), M = q.M, A = q.A, B = q.B, L = q.dai + 1.4, lech = 0.4;
  var aA = H.huong(M, A), aB = H.huong(M, B);
  function theoGoc(a) { return [M[0] + L * Math.cos(a), M[1] + L * Math.sin(a)]; }
  function chamM(g) { g.diem(M, 'M', { huong: [0.4, 1] }); }
  function xoayThuoc(a, huong, ben, ghi) { return { tg: 1.6, ghi: ghi, cu: function (g, e) { g.thuoc(M, theoGoc(a + huong * lech * (1 - e)), { ben: ben }); } }; }
  // Đặt ê ke: một cạnh góc vuông nằm trên tiếp tuyến, trượt tới khi cạnh còn lại đi qua O; đỉnh góc vuông là tiếp điểm T
  function timTiepDiem(T, ten, ghi) {
    var a0 = H.huong(T, M), w = [Math.cos(a0), Math.sin(a0)], dau = dauEke(a0, T, O0), LE = R + 0.7;
    var cham = function (g) { g.diem(T, ten, { huong: T }); };
    return { tg: 2.6, ghi: ghi,
      ve: function (g, e) { if (e > 0.75) { g.doan(O0, T, { mau: MV, rong: 1.6, dut: '5 4' }); cham(g); } },
      xong: cham,
      cu: function (g, e) {
        var K = H.cong(T, H.nhan(w, 2 * (1 - H.doan(e, 0, 0.7))));
        g.eke(K, a0, dau, { loai: 'vuong', dai: LE, doMo: 0.4 + 0.55 * Math.min(1, e * 2) });
        if (e > 0.75) g.but(T);
      } };
  }
  return KhungPhang.kichBan([
    { tg: 1, ghi: '<b>Bước 1.</b> Vẽ một điểm $M$ ở ngoài đường tròn $(O)$.', ve: chamM, xong: chamM, cu: function (g) { g.but(M); } },
    xoayThuoc(aA, -1, 1, '<b>Bước 2.</b> Đặt thước đi qua $M$, xoay thước từ từ cho tới khi mép thước <b>vừa tiếp xúc</b> với đường tròn.'),
    D.doan(M, keo(M, A, 1.2), { ben: 1, ghi: 'Giữ thước, vẽ tiếp tuyến đi qua $M$ theo mép thước.', net: { mau: MT, rong: 3.5 } }),
    xoayThuoc(aB, 1, -1, 'Làm tương tự ở phía dưới: xoay thước quanh $M$ tới khi mép thước vừa chạm đường tròn.'),
    D.doan(M, keo(M, B, 1.2), { ghi: 'Kẻ đường thẳng thứ hai: được <b>hai tiếp tuyến</b> của $(O)$ cùng đi qua $M$.', net: { mau: MT, rong: 3.5 } }),
    timTiepDiem(A, 'A', '<b>Bước 3.</b> Đặt <b>ê ke</b>: một cạnh góc vuông nằm trên tiếp tuyến thứ nhất, trượt ê ke cho tới khi cạnh góc vuông còn lại <b>đi qua tâm $O$</b>. Đỉnh góc vuông là <b>tiếp điểm</b> — chấm điểm $A$.'),
    timTiepDiem(B, 'B', 'Làm tương tự với tiếp tuyến thứ hai: đặt ê ke vuông góc, cạnh còn lại đi qua $O$ — chấm tiếp điểm $B$.'),
  ].concat(buocVuong([{ T: A, X: M }, { T: B, X: M }], '<b>Bước 4.</b> Kí hiệu góc vuông: $MA \\perp OA$, $MB \\perp OB$ (tiếp tuyến vuông góc với bán kính đi qua tiếp điểm).')));
}

KhungPhang.tao({
  ten: 'Tiếp tuyến của đường tròn',
  lop: 9,
  diem: { A: diemDT(50 * RAD), M: [6, 0] },
  nhapGoc: [{ id: 'AMB', ten: '\\widehat{AMB}', min: 5, max: 110, hien: laNgoai, lay: function (P) { var q = tu(P.M); return H.gocDo(q.A, q.M, q.B); },
    dat: function (P, ts, d) { P.M = [R / Math.sin(d * RAD / 2), 0]; } }],
  buocLuoi: 0.5,
  rangBuoc: { A: lenDT, M: function (p) { return [Math.max(R + 0.5, p[0]), 0]; } },
  anTayCam: function (k, P, ts) { return k === 'A' ? !laTren(P, ts) : !laNgoai(P, ts); },
  luaChon: [{ khoa: 'che', gt: 'tren', nhan: 'Vẽ tiếp tuyến', vuaKhung: true,
    ds: [{ gt: 'tren', nhan: 'Tại điểm M trên đường tròn' }, { gt: 'ngoai', nhan: 'Từ điểm M ở ngoài đường tròn' }] }],
  batDau: ['vg'],

  lamSang: [
    { id: 'vg', nhan: 'Tiếp tuyến ⊥ bán kính', mau: MV,
      ghiChu: function (P, ts) { return laTren(P, ts) ? 'Tiếp tuyến $d$ <b>vuông góc với bán kính</b> $OM$ tại tiếp điểm $M$: $d \\perp OM$.' : 'Mỗi tiếp tuyến <b>vuông góc với bán kính</b> đi qua tiếp điểm: $MA \\perp OA$, $MB \\perp OB$.'; } },
    { id: 'R', nhan: 'Khoảng cách từ O bằng R', mau: MR, lap: true,
      ghiChu: function (P, ts) { return 'Khoảng cách từ tâm $O$ đến tiếp tuyến <b>bằng bán kính</b>: $' + (laTren(P, ts) ? 'OM' : 'OA = OB') + ' = R = ' + soL(R) + '$ cm. Mọi điểm $N$ khác trên tiếp tuyến đều có $ON > R$ (nằm ngoài đường tròn).'; } },
    { id: 'dh', nhan: 'Dấu hiệu nhận biết', mau: MN, hien: laTren,
      ghiChu: 'Nếu đường thẳng $d$ <b>đi qua điểm $M$ của đường tròn</b> và <b>vuông góc với bán kính $OM$</b> thì $d$ là tiếp tuyến của đường tròn tại $M$.' },
  ],
  hoatHinh: [
    { id: 'tai', nhan: 'Vẽ tiếp tuyến tại điểm M trên đường tròn (ê ke, thước)', anDiem: true, hien: laTren,
      thoiGian: function (P) { return kbTai(P).tong * 1000; }, ghiChu: function (P, ts, t) { return kbTai(P).ghi(t); } },
    { id: 'thuoc', nhan: 'Vẽ tiếp tuyến từ điểm M ở ngoài đường tròn (thước, ê ke)', anDiem: true, hien: laNgoai,
      thoiGian: function (P) { return kbThuoc(P).tong * 1000; }, ghiChu: function (P, ts, t) { return kbThuoc(P).ghi(t); } },
  ],

  ve: function (g, P, ts) {
    g.duongTron(O0, R, { to: '#93C5FD', doMoTo: 0.2, rong: 2.8 });
    var nhanO = function () { g.diem(O0, 'O', { r: 4, huong: laTren(P, ts) ? H.nhan(P.A, -1) : [-0.4, 1] }); };
    var ht = g.hoat('tai'), hth = g.hoat('thuoc');
    if (ht !== null) { kbTai(P).ve(g, ht); nhanO(); return; }
    if (hth !== null) { kbThuoc(P).ve(g, hth); nhanO(); return; }

    var ds;   // các tiếp tuyến: { T: tiếp điểm, X, Y: hai đầu đoạn vẽ, ten }
    if (laTren(P, ts)) { var q = tai(P.A); ds = [{ T: q.A, X: q.d1, Y: q.d2, ten: 'M', v: q.v }]; }
    else { var w = tu(P.M); ds = [{ T: w.A, X: w.M, Y: keo(w.M, w.A, 1.2), ten: 'A' }, { T: w.B, X: w.M, Y: keo(w.M, w.B, 1.2), ten: 'B' }]; }
    var oVg = g.bat('vg'), oR = g.bat('R'), oDh = g.bat('dh');
    ds.forEach(function (o) { g.doan(o.X, o.Y, { mau: MT, rong: 3 }); });
    if (laTren(P, ts)) g.chu(H.cong(ds[0].X, H.nhan(ds[0].v, 0.35)), 'd', { mau: MT, nghieng: true });
    ds.forEach(function (o) {
      if (oVg || oR || oDh) g.doan(O0, o.T, { mau: oR ? MR : oVg ? MV : MN, rong: oR ? 4 : 3 });
      if (oVg || oDh) g.goc(O0, o.T, o.X, { mau: oVg ? MV : MN, r: 14, sang: oVg ? 'vg' : 'dh' });
      if (oR) g.nhanDo(O0, o.T, 'R = ' + so(R), { mau: MR, t: 0.45 });
    });
    if (oR) {   // điểm N chạy trên tiếp tuyến thứ nhất: ON > R
      var o = ds[0], t = (g.tg('R') || 0) * 0.5, s = Math.sin(t * Math.PI), N = H.lerp(o.T, s >= 0 ? o.X : o.Y, Math.abs(s) * 0.85);
      if (H.dai(N, o.T) > 0.25) {
        g.doan(O0, N, { mau: MN, rong: 2, dut: '6 5' }); g.diem(N, 'N', { r: 4, mau: MN, huong: H.tru(N, O0) });
        g.nhanDo(O0, N, 'ON ≈ ' + so(H.dai(O0, N), 1) + ' > R', { mau: MN, t: 0.82, kc: 'tu', benTrai: H.dai(N, o.X) < H.dai(N, o.Y) === laTren(P, ts) });
      }
    }
    if (oDh) g.diem(ds[0].T, '', { r: 7, mau: MN });
    ds.forEach(function (o) { g.diem(o.T, o.ten, { huong: o.T }); });
    if (laNgoai(P, ts)) g.diem(P.M, 'M', { huong: [0.4, 1] });
    nhanO();
  },
  nhanXet: function (P, ts) {
    if (laTren(P, ts)) return 'Đường thẳng $d$ là <b>tiếp tuyến</b> của $(O)$ tại $M$ ⇔ $d$ đi qua $M \\in (O)$ và $d \\perp OM$.<br>' +
      'Khoảng cách từ $O$ đến $d$: $OM = R = ' + soL(R) + '$ cm.<br><span class="dung">Kéo điểm $M$ trên đường tròn: $d$ luôn vuông góc với $OM$.</span>';
    var q = tu(P.M);
    return 'Từ $M$ ở ngoài $(O)$ kẻ được <b>hai tiếp tuyến</b> $MA$, $MB$.<br>$OA = OB = R = ' + soL(R) + '$; $OM = ' + soL(q.d) + '$; $MA = MB \\approx ' + soL(q.dai) + '$<br>' +
      '<span class="dung">Kéo $M$ trên đường nằm ngang: $MA \\perp OA$ và $MB \\perp OB$ luôn đúng.</span>';
  },
  congThuc: function (P, ts, C) {
    return [{ id: 'vg', ten: 'Tính chất tiếp tuyến', bt: laTren(P, ts) ? '$' + C.m('vg', 'd \\perp OM') + '$ ; $' + C.m('R', 'OM = R') + '$' : '$' + C.m('vg', 'MA \\perp OA,\\ MB \\perp OB') + '$ ; $' + C.m('R', 'OA = OB = R') + '$' }];
  },
  khungNhin: function (P, ts) {
    var ds = [[-R - 0.5, -R - 0.5], [R + 0.5, R + 0.5]];
    if (laNgoai(P, ts)) ds.push([P.M[0] + 1.4, 0]); else { var q = tai(P.A); ds.push(q.d1, q.d2); }
    return ds;
  },
});
</script>
</body>
</html>
