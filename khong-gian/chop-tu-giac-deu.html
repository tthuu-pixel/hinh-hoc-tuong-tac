<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hình chóp tứ giác đều</title>
<link rel="stylesheet" href="../chung/giao-dien.css">
<link rel="stylesheet" href="../chung/khung-3d.css">
<script src="../chung/cau-hinh.js"></script>
<script src="../chung/dang-nhap.js" data-goc="../"></script>
</head>
<body>
<div id="thanh-tren"></div>
<div id="mo-hinh"></div>

<script src="../thu-vien-ngoai/three-bundle.min.js"></script>
<script src="../chung/khung-3d.js"></script>
<script>
/* =====================================================================
   HÌNH CHÓP TỨ GIÁC ĐỀU  S.ABCD  — Toán 8
   Đáy ABCD là hình vuông cạnh a, tâm O; chiều cao SO = h
   M là trung điểm AB, SM là trung đoạn
   ===================================================================== */
var M = KhongGian.MAU, so = KhongGian.so;
function soL(x, l) { return so(x, l).replace(',', '{,}'); }

function soDo(ts) {
  var a = ts.a, h = ts.h;
  return { d: Math.hypot(h, a / 2), canhBen: Math.hypot(h, a / Math.SQRT2), sDay: a * a, p: 2 * a };
}

KhongGian.tao({
  ten: 'Hình chóp tứ giác đều',
  lop: 8,
  donVi: 'cm',

  thamSo: [
    { khoa: 'a', nhan: 'Cạnh đáy a', min: 2, max: 8, buoc: 0.5, gt: 5, donVi: 'cm', mau: M.canh },
    { khoa: 'h', nhan: 'Chiều cao h', min: 1, max: 8, buoc: 0.5, gt: 5, donVi: 'cm', mau: M.chieuCao },
  ],

  daDien: function (ts) {
    var x = ts.a / 2;
    return {
      dinh: { S: [0, ts.h, 0], A: [-x, 0, x], B: [x, 0, x], C: [x, 0, -x], D: [-x, 0, -x] },
      diemPhu: { O: [0, 0, 0], M: [0, 0, x] },
      huongNhan: { O: [-1, -0.3, -0.4], M: [0, -0.5, 1] },
      mat: [
        { ten: 'ABCD', dinh: ['A', 'B', 'C', 'D'] },
        { ten: 'SAB', dinh: ['S', 'A', 'B'] },
        { ten: 'SBC', dinh: ['S', 'B', 'C'] },
        { ten: 'SCD', dinh: ['S', 'C', 'D'] },
        { ten: 'SDA', dinh: ['S', 'D', 'A'] },
      ],
    };
  },

  lamSang: [
    {
      id: 'a', nhan: 'Cạnh đáy a', mau: M.canh, canh: [['A', 'B'], ['B', 'C'], ['C', 'D'], ['D', 'A']],
      nhanDo: function (ts) { return [{ doan: ['A', 'B'], chu: '<i>a</i> = ' + so(ts.a) + ' cm' }]; },
      ghiChu: function (ts) { return 'Đáy $ABCD$ là <b>hình vuông</b> cạnh $a = ' + soL(ts.a) + '$ cm.'; },
    },
    {
      id: 'ben', nhan: 'Cạnh bên', mau: M.canhBen, canh: [['S', 'A'], ['S', 'B'], ['S', 'C'], ['S', 'D']],
      nhanDo: function (ts) { return [{ doan: ['S', 'B'], chu: 'SB ≈ ' + so(soDo(ts).canhBen), t: 0.25 }]; },
      ghiChu: function (ts) { return 'Bốn <b>cạnh bên</b> bằng nhau: $SA = SB = SC = SD \\approx ' + soL(soDo(ts).canhBen) + '$ cm.'; },
    },
    {
      id: 'h', nhan: 'Đường cao SO', mau: M.chieuCao, doan: [['S', 'O']],
      nhanDo: function (ts) { return [{ doan: ['S', 'O'], chu: '<i>h</i> = ' + so(ts.h), huong: [-1, 0, 0], t: 0.35 }]; },
      ghiChu: function (ts) { return '$SO$ là <b>đường cao</b> của hình chóp, $O$ là tâm hình vuông đáy (giao điểm hai đường chéo). $SO = h = ' + soL(ts.h) + '$ cm.'; },
    },
    {
      id: 'd', nhan: 'Trung đoạn SM', mau: M.trungDoan, doan: [['S', 'M']],
      nhanDo: function (ts) { return [{ doan: ['S', 'M'], chu: '<i>d</i> ≈ ' + so(soDo(ts).d), huong: [1, 0, 0], t: 0.7 }]; },
      ghiChu: function (ts) { return '$SM$ là <b>trung đoạn</b>: đường cao của mặt bên $SAB$ kẻ từ $S$ ($M$ là trung điểm $AB$). $d \\approx ' + soL(soDo(ts).d) + '$ cm.'; },
    },
    {
      id: 'day', nhan: 'Mặt đáy', mau: M.matDay, mat: ['ABCD'],
      ghiChu: function (ts) { return 'Mặt đáy $ABCD$ là hình vuông, diện tích $a^2 = ' + soL(ts.a * ts.a) + '$ cm².'; },
    },
    {
      id: 'xq', nhan: 'Diện tích xung quanh', mau: M.xungQuanh, mat: ['SAB', 'SBC', 'SCD', 'SDA'],
      ghiChu: 'Bốn <b>mặt bên</b> là bốn tam giác cân bằng nhau, mỗi tam giác có đáy $a$ và đường cao là trung đoạn $d$.',
    },
    {
      id: 'V', nhan: 'Thể tích', mau: M.theTich, khoi: true,
      ghiChu: 'Bấm <b>“Đổ nước 3 lần”</b>: đổ đầy nước vào hình chóp rồi rót sang hình hộp cùng đáy, cùng chiều cao. Đúng 3 lần thì đầy hình hộp.',
    },
  ],

  congThuc: function (ts, C) {
    var s = soDo(ts), a = ts.a, h = ts.h, n = C.soL;
    return [
      { id: 'day', ten: 'Diện tích đáy (hình vuông)', bt: '$S_{\\text{đáy}} = {' + C.m('a', 'a') + '}^2 = ' + n(a) + '^2 = \\mathbf{' + n(s.sDay) + '}$ (cm²)' },
      { id: 'd', ten: 'Trung đoạn (định lí Pythagore trong tam giác SOM)', bt: '$' + C.m('d', 'd') + ' = \\sqrt{{' + C.m('h', 'h') + '}^2 + OM^2} = \\sqrt{' + n(h) + '^2 + ' + n(a / 2) + '^2} \\approx \\mathbf{' + n(s.d) + '}$ (cm)' },
      { id: 'xq', ten: 'Diện tích xung quanh', bt: '$S_{xq} = p\\cdot ' + C.m('d', 'd') + ' = ' + n(s.p) + '\\cdot ' + n(s.d) + ' \\approx \\mathbf{' + n(s.p * s.d) + '}$ (cm²)<br><span style="font-size:15px">($p$ là nửa chu vi đáy: $p = \\dfrac{4' + C.m('a', 'a') + '}{2} = ' + n(s.p) + '$)</span>' },
      { id: 'V', ten: 'Thể tích', bt: '$V = \\dfrac{1}{3}S_{\\text{đáy}}\\cdot ' + C.m('h', 'h') + ' = \\dfrac{1}{3}\\cdot ' + n(s.sDay) + '\\cdot ' + n(h) + ' \\approx \\mathbf{' + n(s.sDay * h / 3) + '}$ (cm³)' },
    ];
  },

  traiHinh: { matGoc: 'ABCD' },

  matCat: [
    { id: 'ngang', nhan: 'Song song với đáy',
      matPhang: function (ts, t) { return { phapTuyen: [0, 1, 0], diem: [0, t * ts.h, 0] }; } },
    { id: 'quaCheo', nhan: 'Qua đỉnh và đường chéo đáy', diemDacBiet: [0.5],
      matPhang: function (ts, t) { var x = ts.a / 2; return { phapTuyen: [1, 0, 1], diem: [-x + t * ts.a, 0, -x + t * ts.a] }; } },
    { id: 'quaDinh', nhan: 'Qua đỉnh, song song AB', diemDacBiet: [0.5],
      matPhang: function (ts, t) { return { phapTuyen: [0, 0, 1], diem: [0, 0, -ts.a / 2 + t * ts.a] }; } },
  ],

  doNuoc: function (ts) {
    var x = ts.a / 2;
    return { day: [[-x, x], [x, x], [x, -x], [-x, -x]], cao: ts.h, lech: [ts.a * 1.45, 0, 0], ten: 'Hình hộp cùng đáy, cùng chiều cao' };
  },
});
</script>
</body>
</html>
