<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hình thang vuông</title>
<link rel="stylesheet" href="../../chung/giao-dien.css">
<link rel="stylesheet" href="../../chung/khung-3d.css">
<link rel="stylesheet" href="../../chung/khung-phang.css">
<script src="../../chung/cau-hinh.js"></script>
<script src="../../chung/dang-nhap.js" data-goc="../../"></script>
</head>
<body>
<div id="thanh-tren"></div>
<div id="mo-hinh"></div>

<script src="../../chung/khung-phang.js"></script>
<script>
var H = KhungPhang.H, so = KhungPhang.so, M = KhungPhang.MAU, TG = KhungPhang.tuGiac, DX = KhungPhang.doiXung;
var M1 = '#E0342F', M2 = '#1E6FE0', MG1 = '#F59E0B', MG2 = '#7C3AED', MCAO = '#92400E';
function veCanh(g, P1, P2, on, mau, vach) { g.doan(P1, P2, on ? { mau: mau, rong: 5, kyHieu: vach || 0 } : { rong: 2.8 }); }
function veGoc(g, q, i, on, mau, vach, o) { o = o || {}; return TG.goc(g, q, i, { mau: on ? mau : '#94A3B8', r: o.r || 30, kyHieu: on ? (vach || 1) : 1, doMoTo: on ? 0.35 : 0.1, nhan: on ? true : undefined, le: 0 }); }
var soL = KhungPhang.soL;
/* =====================================================================
   HÌNH THANG VUÔNG — Toán 8
   AB // CD, AD ⊥ AB. A cố định; kéo B (ngang), D (dọc), C (ngang).
   ===================================================================== */
function dinh(P) { return { A: P.A, B: P.B, C: [P.C[0], P.D[1]], D: P.D }; }

KhungPhang.tao({
  ten: 'Hình thang vuông',
  lop: 8,
  diem: { A: [-3, 0], B: [4, 0], C: [1, 3], D: [-3, 3] },
  coDinh: ['A'],
  buocLuoi: 0.5,
  rangBuoc: {
    B: function (p, P) { return [Math.max(P.A[0] + 1, p[0]), P.A[1]]; },
    D: function (p, P) { return [P.A[0], Math.max(P.A[1] + 0.5, p[1])]; },
    C: function (p, P) { return [Math.max(P.D[0] + 0.5, p[0]), P.D[1]]; },
  },
  sauKeo: function (ten, P) { if (ten === 'D') P.C = [P.C[0], P.D[1]]; },
  batDau: ['vuong'],

  lamSang: [
    { id: 'day', nhan: 'Hai đáy AB // CD', mau: M1, ghiChu: 'Hình thang vuông vẫn là hình thang: ${AB \\parallel CD}$.' },
    { id: 'vuong', nhan: 'Hai góc vuông A, D', mau: '#16A34A', ghiChu: 'Hình thang vuông là hình thang có <b>một góc vuông</b>. Khi đó góc kề cạnh bên còn lại cũng vuông: $\\widehat{A} = \\widehat{D} = 90^\\circ$.' },
    { id: 'cao', nhan: 'AD là đường cao', mau: MCAO, ghiChu: function (P) { return 'Cạnh bên $AD$ vuông góc với hai đáy nên $AD$ cũng là <b>đường cao</b>: $h = AD = ' + soL(P.D[1] - P.A[1]) + '$ cm.'; } },
    { id: 'goc', nhan: 'B̂ + Ĉ = 180°', mau: MG2, ghiChu: function (P) { var q = dinh(P); return 'Hai góc kề cạnh bên $BC$ bù nhau: $\\widehat{B} + \\widehat{C} = ' + soL(H.gocDo(q.A, q.B, q.C), 0) + '^\\circ + ' + soL(H.gocDo(q.B, q.C, q.D), 0) + '^\\circ = 180^\\circ$.'; } },
  ],

  ve: function (g, P) {
    var q = dinh(P);
    g.daGiac([q.A, q.B, q.C, q.D], { to: '#93C5FD', doMoTo: 0.22, rong: 0 });
    veCanh(g, q.A, q.B, g.bat('day'), M1); veCanh(g, q.D, q.C, g.bat('day'), M1);
    if (g.bat('cao')) { g.doan(q.A, q.D, { sang: 'cao' }); g.nhanDo(q.A, q.D, 'h = ' + so(q.D[1] - q.A[1]), { mau: MCAO, kc: 28 }); } else veCanh(g, q.A, q.D, false);
    veCanh(g, q.B, q.C, false);
    var ov = g.bat('vuong');
    TG.goc(g, q, 0, { mau: ov ? '#16A34A' : '#475569', r: ov ? 22 : 16, doMoTo: ov ? 0.4 : 0.1 });
    TG.goc(g, q, 3, { mau: ov ? '#16A34A' : '#475569', r: ov ? 22 : 16, doMoTo: ov ? 0.4 : 0.1 });
    var og = g.bat('goc'); veGoc(g, q, 1, og, MG2, 1); veGoc(g, q, 2, og, MG1, 2);
    TG.nhanDinh(g, q);
  },

  nhanXet: function (P) {
    return 'Hình thang vuông $ABCD$: ${AB \\parallel CD}$, $\\widehat{A} = \\widehat{D} = 90^\\circ$' + TG.dauHieu('Dấu hiệu nhận biết', ['Hình thang có <b>một góc vuông</b> là hình thang vuông.']);
  },
  congThuc: function (P, ts, C) { var q = dinh(P), a = H.dai(q.A, q.B), b = H.dai(q.D, q.C), h = q.D[1] - q.A[1]; return [{ id: 'cao', ten: 'Diện tích', bt: '$S = \\dfrac{(AB + CD)\\cdot ' + C.m('cao', 'AD') + '}{2} = \\mathbf{' + soL((a + b) * h / 2) + '}$ (cm²)' }]; },
});
</script>
</body>
</html>
