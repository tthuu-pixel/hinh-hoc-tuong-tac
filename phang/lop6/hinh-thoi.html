<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hình thoi</title>
<link rel="stylesheet" href="../../chung/giao-dien.css">
<link rel="stylesheet" href="../../chung/khung-3d.css">
<link rel="stylesheet" href="../../chung/khung-phang.css">
<script src="../../chung/cau-hinh.js"></script>
<script src="../../chung/dang-nhap.js" data-goc="../../"></script>
</head>
<body>
<div id="thanh-tren"></div>
<div id="mo-hinh"></div>

<script src="../../chung/khung-phang.js"></script>
<script>
/* =====================================================================
   HÌNH THOI ABCD — Toán 6
   Nhận dạng (cạnh, góc, đường chéo, cạnh đối, cạnh kề), chu vi, diện tích,
   vẽ bằng thước thẳng và thước hai lề, gấp cắt giấy, tính đối xứng.
   Hai đường chéo AC (nằm ngang), BD (thẳng đứng) cắt nhau tại O.
   Kéo A để đổi đường chéo AC, kéo B để đổi đường chéo BD.
   ===================================================================== */
var H = KhungPhang.H, so = KhungPhang.so, M = KhungPhang.MAU, DX = KhungPhang.doiXung, CV = KhungPhang.chuVi, D = KhungPhang.dung;
var soL = KhungPhang.soL;
var MAU_CANH = '#2563EB', MAU_G1 = '#16A34A', MAU_G2 = '#EA580C', MAU_CHEO = M.duongCheo, MAU_DOI1 = '#DC2626', MAU_DOI2 = '#7C3AED', MAU_KE = '#0891B2';
function dinh(P) { var p = -P.A[0], q = P.B[1]; return { A: [-p, 0], B: [0, q], C: [p, 0], D: [0, -q], O: [0, 0], p: p, q: q }; }
function goc(P) { var q = dinh(P), A = 2 * Math.atan2(q.q, q.p) * 180 / Math.PI; return { A: A, B: 180 - A }; }
function thongTin(P) {
  var q = dinh(P), vuong = H.bang(q.p, q.q), truc = [[q.A, q.C], [q.D, q.B]];
  if (vuong) truc.push([H.trung(q.A, q.B), H.trung(q.C, q.D)], [H.trung(q.B, q.C), H.trung(q.D, q.A)]);
  return { ten: vuong ? 'Hình thoi này (là hình vuông)' : 'Hình thoi', ds: [q.A, q.B, q.C, q.D], tam: q.O, truc: truc };
}
function tenDinh(g, q, chi) {
  var huong = { A: [-1, 0], B: [0, 1], C: [1, 0], D: [0, -1] };
  (chi || 'ABCD').split('').forEach(function (k) { g.diem(q[k], k, { huong: huong[k] }); });
}
function bonCanh(g, q, mau) { [[q.A, q.B], [q.B, q.C], [q.C, q.D], [q.D, q.A]].forEach(function (c) { g.doan(c[0], c[1], { mau: mau || MAU_CANH, rong: 3.5, kyHieu: 1 }); }); }
function canhDoi(g, q) {
  g.doan(q.A, q.B, { mau: MAU_DOI1, rong: 4.5 }); g.doan(q.D, q.C, { mau: MAU_DOI1, rong: 4.5 });
  g.doan(q.A, q.D, { mau: MAU_DOI2, rong: 4.5 }); g.doan(q.B, q.C, { mau: MAU_DOI2, rong: 4.5 });
  g.songSong(q.A, q.B, 1, MAU_DOI1); g.songSong(q.D, q.C, 1, MAU_DOI1); g.songSong(q.A, q.D, 2, MAU_DOI2); g.songSong(q.B, q.C, 2, MAU_DOI2);
}

/* ---------- Vẽ hình thoi bằng thước thẳng và thước hai lề ---------- */
function kbVe(P) {
  var q = dinh(P), A = q.A, B = q.B, C = q.C, Dd = q.D, a = Math.hypot(q.p, q.q), n = 0, tia = { rong: 2, mau: '#475569' };
  var X = H.lerp(B, C, 1.3), Y = H.lerp(Dd, C, 1.3);
  function Bc(t) { n++; return '<b>Bước ' + n + '.</b> ' + t; }
  var dat1, dat2;
  return KhungPhang.kichBan([
    D.doanChia(A, B, { ghi: Bc('Dùng thước vẽ đoạn thẳng $AB = ' + soL(a) + '$ cm.'), sau: function (g) { tenDinh(g, q, 'AB'); } }),
    D.doanChia(A, Dd, { ben: 1, ghi: Bc('Vẽ đoạn thẳng $AD$ có cùng độ dài: $AD = AB = ' + soL(a) + '$ cm. Hai cạnh kề $AB$, $AD$ bằng nhau.'),
      sau: function (g) { tenDinh(g, q, 'D'); g.kyHieu(A, B, 1, MAU_CANH); g.kyHieu(A, Dd, 1, MAU_CANH); } }),
    (dat1 = D.datThuocHaiLe(A, Dd, B, B, X, { ghi: Bc('Qua $B$ vẽ đường thẳng song song với $AD$: đặt một lề của thước hai lề trùng với $AD$, giữ thước luôn song song và trượt cho tới khi lề thước đi qua $B$.') })),
    D.keTheoThuocHaiLe(dat1, B, X, { net: tia, ghi: 'Kẻ đường thẳng $Bx$ theo lề thước: $Bx \\parallel AD$.', sau: function (g) { g.chu(X, 'x', { mau: '#475569', dx: 10, nghieng: true }); } }),
    (dat2 = D.datThuocHaiLe(A, B, Dd, Dd, Y, { ghi: Bc('Qua $D$ vẽ đường thẳng song song với $AB$: đặt lề thước trùng với $AB$ rồi trượt song song tới khi lề thước đi qua $D$.') })),
    D.keTheoThuocHaiLe(dat2, Dd, Y, { net: tia, ghi: 'Kẻ đường thẳng $Dy$ theo lề thước: $Dy \\parallel AB$.', sau: function (g) { g.chu(Y, 'y', { mau: '#475569', dx: 10, nghieng: true }); } }),
    D.hien(function (g) { g.diem(C, 'C', { huong: [1, 0], mau: '#0D9488' }); }, { tg: 0.9, ghi: Bc('Hai đường thẳng $Bx$ và $Dy$ cắt nhau tại $C$.') }),
    D.doan(B, C, { tg: 0.6, ghi: 'Tô đậm hai đoạn $BC$ và $DC$.' }),
    D.doan(Dd, C, { tg: 0.6 }),
    D.hien(function (g) { g.daGiac([A, B, C, Dd], { to: '#93C5FD', doMoTo: 0.35, rong: 0 }); bonCanh(g, q); tenDinh(g, q); },
      { tg: 1.3, ghi: 'Ta được <b>hình thoi $ABCD$</b>: bốn cạnh bằng nhau, các cạnh đối song song.' }),
  ]);
}

/* ---------- Tình huống SGK: gấp đôi hai lần tờ giấy hình chữ nhật, cắt một nhát, mở ra ---------- */
function cfgGapCat(P) {
  var q = dinh(P), p = q.p, h = q.q;
  return {
    giay: [[-p, -h], [p, -h], [p, h], [-p, h]],
    gap: [{ A: [0, -1], B: [0, 1], dau: -1 }, { A: [-1, 0], B: [1, 0], dau: -1 }],
    cat: [[-p, 0], [0, h]], giu: [[-p, 0], [0, 0], [0, h]], bo: [[-p, 0], [0, h], [-p, h]],
    nep: [[[-p, 0], [p, 0]], [[0, -h], [0, h]]],
    ghi: ['Lấy một tờ giấy hình chữ nhật.', 'Gấp đôi tờ giấy theo chiều dọc…', 'Gấp đôi thêm một lần nữa theo chiều ngang…',
      'Cắt theo đường nối hai điểm nằm trên hai nếp gấp (đường nét đứt màu đỏ).', 'Bỏ phần giấy thừa.', 'Mở tờ giấy ra…', 'Mở tiếp…',
      'Ta được <b>hình thoi $ABCD$</b>. Hai nếp gấp chính là <b>hai đường chéo</b>, chúng <b>vuông góc</b> với nhau.'],
  };
}

KhungPhang.tao({
  ten: 'Hình thoi',
  lop: 6,
  diem: { A: [-3, 0], B: [0, 2] },
  buocLuoi: 0.5,
  rangBuoc: {
    A: function (p) { return [Math.min(-0.5, p[0]), 0]; },
    B: function (p) { return [0, Math.max(0.5, p[1])]; },
  },
  luaChon: [DX.luaChonTruc(2)],
  hopChon: [DX.hopChonVet],
  tieuDeSang: 'Chú thích · bấm để làm nổi bật',

  lamSang: [
    { id: 'canh', nhan: 'Cạnh', mau: MAU_CANH,
      ghiChu: function (P) { var q = dinh(P); return 'Hình thoi có <b>bốn cạnh bằng nhau</b>: $AB = BC = CD = DA \\approx ' + soL(Math.hypot(q.p, q.q)) + '$ cm.'; } },
    { id: 'goc', nhan: 'Góc', mau: MAU_G1,
      ghiChu: function (P) { var gg = goc(P); return '<b>Các góc đối bằng nhau</b>: $\\widehat{A} = \\widehat{C} \\approx ' + soL(gg.A, 0) + '^\\circ$; $\\widehat{B} = \\widehat{D} \\approx ' + soL(gg.B, 0) + '^\\circ$.'; } },
    { id: 'cheo', nhan: 'Đường chéo', mau: MAU_CHEO,
      ghiChu: function (P) { var q = dinh(P); return '<b>Hai đường chéo vuông góc</b> với nhau tại $O$: $AC \\perp BD$; $AC = ' + soL(2 * q.p) + '$ cm, $BD = ' + soL(2 * q.q) + '$ cm.'; } },
    { id: 'doi', nhan: 'Hai cạnh đối', mau: MAU_DOI2,
      ghiChu: '<b>Các cạnh đối song song</b> với nhau: $AB \\parallel CD$ (một mũi tên), $AD \\parallel BC$ (hai mũi tên).' },
    { id: 'ke', nhan: 'Hai cạnh kề', mau: MAU_KE,
      ghiChu: 'Hai cạnh $AB$ và $AD$ chung đỉnh $A$ là <b>hai cạnh kề</b>. Ở hình thoi, hai cạnh kề bằng nhau.' },
  ].concat(CV.lamSang({
    cv: function (P) { var q = dinh(P), a = Math.hypot(q.p, q.q); return 'Hình thoi có bốn cạnh bằng nhau: $C = 4 \\cdot a \\approx 4 \\cdot ' + soL(a) + ' \\approx \\mathbf{' + soL(4 * a) + '}$ <b>cm</b>.'; },
    dt: function (P) { var q = dinh(P); return 'Diện tích hình thoi bằng <b>nửa tích hai đường chéo</b>: $' + soL(2 * q.p) + ' \\cdot ' + soL(2 * q.q) + ' : 2 = \\mathbf{' + soL(2 * q.p * q.q) + '}$ <b>cm²</b>.'; },
  })).concat(DX.lamSang(thongTin)),

  hoatHinh: [
    { id: 've', nhan: 'Vẽ bằng thước thẳng và thước hai lề', anDiem: true,
      vuaKhung: function (P) { var q = dinh(P); return [H.lerp(q.B, q.C, 1.4), H.lerp(q.D, q.C, 1.4), [q.A[0] - 1, q.B[1] + 1.2], [q.A[0] - 1, q.D[1] - 1.2]]; },
      thoiGian: function (P) { return kbVe(P).tong * 1000; }, ghiChu: function (P, ts, t) { return kbVe(P).ghi(t); } },
    { id: 'gapCat', nhan: 'Gấp, cắt giấy thành hình thoi', thoiGian: 10000, anDiem: true,
      vuaKhung: function (P) { var q = dinh(P); return [[-q.p - 1.5, -q.q], [q.p, q.q + 1.5]]; },
      ghiChu: function (P, ts, t) { return DX.gapCatGhi(t, cfgGapCat(P)); } },
    { id: 'ghep', nhan: 'Cắt ghép thành hình chữ nhật', thoiGian: 6000,
      ghiChu: function (P, ts, t) {
        var q = dinh(P);
        if (t < 0.15) return 'Cắt hình thoi theo hai đường chéo thành <b>4 tam giác vuông</b> bằng nhau.';
        if (t < 0.95) return 'Chuyển hai tam giác bên trái sang bên phải…';
        return 'Được <b>hình chữ nhật</b> có hai cạnh là $OC = ' + soL(q.p) + '$ cm và $BD = ' + soL(2 * q.q) + '$ cm, diện tích $= ' + soL(q.p) + ' \\cdot ' + soL(2 * q.q) + ' = \\mathbf{' + soL(2 * q.p * q.q) + '}$ <b>cm²</b> $= AC \\cdot BD : 2$.';
      } },
  ].concat(DX.hoatHinh(thongTin)),

  ve: function (g, P, ts) {
    var q = dinh(P), f = thongTin(P), t = g.hoat('ghep'), tv = g.hoat('ve'), tg = g.hoat('gapCat');
    if (tv !== null) { kbVe(P).ve(g, tv); return; }
    if (tg !== null) { DX.gapCat(g, tg, cfgGapCat(P)); if (tg >= 0.999) { bonCanh(g, q); tenDinh(g, q); g.goc(q.C, q.O, q.B, { mau: MAU_CHEO, nhan: false, r: 14 }); } return; }
    if (t !== null) {
      var e = H.em(H.doan(t, 0.18, 0.9)), p = q.p, h = q.q;
      g.daGiac([[0, h], [p, h], [p, -h], [0, -h]], { to: 'none', dut: '6 5', mauNet: '#94A3B8', rong: 1.5 });
      g.daGiac([q.O, q.B, q.C], { to: '#FBBF24', doMoTo: 0.7 }); g.daGiac([q.O, q.C, q.D], { to: '#F59E0B', doMoTo: 0.7 });
      g.daGiac([q.O, q.A, q.B].map(function (x) { return H.cong(x, [p * e, -h * e]); }), { to: '#60A5FA', doMoTo: 0.7 });
      g.daGiac([q.O, q.D, q.A].map(function (x) { return H.cong(x, [p * e, h * e]); }), { to: '#93C5FD', doMoTo: 0.7 });
      var ec = H.doan(t, 0.01, 0.17);
      if (ec > 0 && ec < 1) {
        var ec1 = Math.min(1, ec * 2), ec2 = Math.max(0, ec * 2 - 1);
        g.doan(q.B, H.lerp(q.B, q.D, ec1), { mau: '#DC2626', rong: 2.5, dut: '8 5' });
        if (ec2 > 0) g.doan(q.O, H.lerp(q.O, q.A, ec2), { mau: '#DC2626', rong: 2.5, dut: '8 5' });
        if (ec1 < 1) g.keo(H.lerp(q.B, q.D, ec1), H.huong(q.B, q.D), { nhip: ec1 });
        else g.keo(H.lerp(q.O, q.A, ec2), H.huong(q.O, q.A), { nhip: ec2 });
      }
      return;
    }
    var hoat = DX.dangHoat(g), a = Math.hypot(q.p, q.q), gg = goc(P);
    if (!hoat) g.daGiac(f.ds, {});
    DX.ve(g, f, ts);
    if (hoat) return;
    if (g.bat('cheo')) {
      g.doan(q.A, q.C, { sang: 'cheo', rongSang: 4 }); g.doan(q.B, q.D, { sang: 'cheo', rongSang: 4 });
      g.goc(q.C, q.O, q.B, { sang: 'cheo', nhan: false, r: 14 });
      g.nhanDo(q.A, q.C, 'AC = ' + so(2 * q.p), { t: 0.25, kc: 16, sang: 'cheo' });
      g.nhanDo(q.D, q.B, 'BD = ' + so(2 * q.q), { t: 0.25, kc: 16, benTrai: false, sang: 'cheo' });
      g.diem(q.O, 'O', { mau: MAU_CHEO, huong: [0.8, -0.8] });
    }
    if (g.bat('doi')) canhDoi(g, q);
    if (g.bat('canh')) [[q.A, q.B, 'AB'], [q.B, q.C, 'BC'], [q.C, q.D, 'CD'], [q.D, q.A, 'DA']].forEach(function (c) {
      g.doan(c[0], c[1], { sang: 'canh', kyHieu: 1 });
      g.nhanDo(c[0], c[1], c[2] + ' ≈ ' + so(a), { sang: 'canh', benTrai: true, kc: 'tu' });
    });
    if (g.bat('ke')) { g.doan(q.A, q.B, { mau: MAU_KE, rong: 6 }); g.doan(q.A, q.D, { mau: MAU_KE, rong: 6 }); g.kyHieu(q.A, q.B, 1, '#fff'); g.kyHieu(q.A, q.D, 1, '#fff'); g.diem(q.A, '', { r: 7, mau: MAU_KE }); }
    if (g.bat('goc')) {
      g.goc(q.D, q.A, q.B, { mau: MAU_G1, r: 26, nhan: so(gg.A, 0) + '°', kyHieu: 1, xaNhan: 18 });
      g.goc(q.B, q.C, q.D, { mau: MAU_G1, r: 26, nhan: so(gg.A, 0) + '°', kyHieu: 1, xaNhan: 18 });
      g.goc(q.A, q.B, q.C, { mau: MAU_G2, r: 22, nhan: so(gg.B, 0) + '°', kyHieu: 2, xaNhan: 18 });
      g.goc(q.C, q.D, q.A, { mau: MAU_G2, r: 22, nhan: so(gg.B, 0) + '°', kyHieu: 2, xaNhan: 18 });
    }
    var m = 2 * q.p, nn = 2 * q.q, tC = '\\textcolor{' + M.duongCheo + '}';
    CV.ve(g, { ds: f.ds,
      canh: [[q.A, q.B], [q.B, q.C], [q.C, q.D], [q.D, q.A]].map(function (c) { return { A: c[0], B: c[1], nhan: '≈ ' + so(a) }; }),
      cv: ['C = 4 \\cdot a', '\\phantom{C} \\approx 4 \\cdot ' + soL(a), '\\phantom{C} \\approx \\mathbf{' + soL(4 * a) + '}\\ \\text{cm}'],
      dt: ['S = ' + tC + '{AC} \\cdot ' + tC + '{BD} : 2', '\\phantom{S} = ' + soL(m) + ' \\cdot ' + soL(nn) + ' : 2', '\\phantom{S} = \\mathbf{' + soL(m * nn / 2) + '}\\ \\text{cm}^2'],
      phuDt: function (g, e) {
        if (e <= 0 || g.bat('cheo')) return;
        g.doan(q.A, H.lerp(q.A, q.C, e), { mau: M.duongCheo, rong: 4 }); g.doan(q.B, H.lerp(q.B, q.D, e), { mau: M.duongCheo, rong: 4 });
        if (e >= 1) { g.nhanDo(q.A, q.C, 'AC = ' + so(m), { t: 0.25, kc: 16, mau: M.duongCheo }); g.nhanDo(q.D, q.B, 'BD = ' + so(nn), { t: 0.25, kc: 16, benTrai: false, mau: M.duongCheo }); }
      } });
    tenDinh(g, q);
  },

  congThuc: function (P, ts, C) {
    var q = dinh(P), a = Math.hypot(q.p, q.q);
    return [
      { id: 'cv', ten: 'Chu vi', bt: '$C = 4 \\cdot a \\approx 4 \\cdot ' + soL(a) + ' \\approx \\mathbf{' + soL(4 * a) + '}$ (cm)' },
      { id: 'dt', ten: 'Diện tích', bt: '$S = ' + C.m('cheo', 'AC') + ' \\cdot ' + C.m('cheo', 'BD') + ' : 2 = ' + soL(2 * q.p) + ' \\cdot ' + soL(2 * q.q) + ' : 2 = \\mathbf{' + soL(2 * q.p * q.q) + '}$ (cm²)' },
    ];
  },
  nhanXet: function (P) {
    var q = dinh(P), gg = goc(P);
    function dong(mau, td, ct) { return '<div style="margin:3px 0 2px">• <b style="color:' + mau + '">' + td + '</b>:<br><span style="padding-left:14px">' + ct + '</span></div>'; }
    return '<b>Hình thoi $ABCD$</b> có:' +
      dong(MAU_CANH, 'Bốn cạnh bằng nhau', '$AB = BC = CD = DA \\approx ' + soL(Math.hypot(q.p, q.q)) + '$ cm') +
      dong(MAU_CHEO, 'Hai đường chéo vuông góc với nhau', '$AC \\perp BD$ tại $O$') +
      dong(MAU_DOI2, 'Các cạnh đối song song với nhau', '$AB \\parallel CD$; $AD \\parallel BC$') +
      dong(MAU_G1, 'Các góc đối bằng nhau', '$\\widehat{A} = \\widehat{C} \\approx ' + soL(gg.A, 0) + '^\\circ$; $\\widehat{B} = \\widehat{D} \\approx ' + soL(gg.B, 0) + '^\\circ$') +
      '<div style="height:4px"></div>' + DX.nhanXet(thongTin(P)) + '<br><span class="dung">Kéo A hoặc B để đổi độ dài hai đường chéo.</span>';
  },
  khungNhin: function (P, ts, bat) { var q = dinh(P), ds = [q.A, q.B, q.C, q.D]; return [q.C, q.D, [q.p, -q.q], [q.p, q.q]].concat(CV.khungNhin(ds, bat)); },
});
</script>
</body>
</html>
