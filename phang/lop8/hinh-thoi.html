<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hình thoi</title>
<link rel="stylesheet" href="../../chung/giao-dien.css">
<link rel="stylesheet" href="../../chung/khung-3d.css">
<link rel="stylesheet" href="../../chung/khung-phang.css">
<script src="../../chung/cau-hinh.js"></script>
<script src="../../chung/dang-nhap.js" data-goc="../../"></script>
</head>
<body>
<div id="thanh-tren"></div>
<div id="mo-hinh"></div>

<script src="../../chung/thanh-chia.js"></script>
<script src="../../chung/khung-phang.js"></script>
<script>
var H = KhungPhang.H, so = KhungPhang.so, M = KhungPhang.MAU, TG = KhungPhang.tuGiac, DX = KhungPhang.doiXung;
var M1 = '#E0342F', M2 = '#1E6FE0', MG1 = '#F59E0B', MG2 = '#7C3AED', MCAO = '#92400E';
function veCanh(g, P1, P2, on, mau, vach) { g.doan(P1, P2, on ? { mau: mau, rong: 5, kyHieu: vach || 0 } : { rong: 2.8 }); }
function veGoc(g, q, i, on, mau, vach, o) { o = o || {}; return TG.goc(g, q, i, { mau: on ? mau : '#94A3B8', r: o.r || 30, kyHieu: on ? (vach || 1) : 1, doMoTo: on ? 0.35 : 0.1, nhan: on ? true : undefined, le: 0 }); }
var soL = KhungPhang.soL;
/* =====================================================================
   HÌNH THOI — Toán 8
   Tâm O cố định. Kéo A (một nửa đường chéo AC), kéo B (nửa đường chéo BD,
   luôn vuông góc với OA). C, D đối xứng với A, B qua O.
   ===================================================================== */
var O0 = [0, 0];
function phap(P) { var u = H.tru(P.A, O0), L = Math.hypot(u[0], u[1]) || 1; return [-u[1] / L, u[0] / L]; }
function dinh(P) { return { A: P.A, B: P.B, C: [-P.A[0], -P.A[1]], D: [-P.B[0], -P.B[1]] }; }

/* ---------- Vẽ hình bằng dụng cụ (dùng chung) ---------- */
var D = KhungPhang.dung, MAU_GOC_VE = '#16A34A', TIA = { rong: 2, mau: '#475569' };
function donVi(v) { var L = Math.hypot(v[0], v[1]) || 1; return [v[0] / L, v[1] / L]; }
function tenVe(g, q, chi, tam) {
  tam = tam || H.nhan(H.cong(H.cong(q.A, q.B), H.cong(q.C, q.D)), 0.25);
  chi.split('').forEach(function (k) { g.diem(q[k], k, { huong: donVi(H.tru(q[k], tam)) }); });
}
function tenTia(g, X, ten, P) { var u = donVi(H.tru(X, P)); g.chu(H.cong(X, H.nhan(u, 0.35)), ten, { mau: '#475569', nghieng: true }); }
function muiTenDay(g, m, u) { g.duong([H.cong(m, H.cong(H.nhan(u, -0.15), [-u[1] * 0.15, u[0] * 0.15])), H.cong(m, H.nhan(u, 0.1)), H.cong(m, H.cong(H.nhan(u, -0.15), [u[1] * 0.15, -u[0] * 0.15]))], { mau: M1, rong: 2.5 }); }
function nutVe(nhan) {
  return { id: 've', nhan: nhan, anDiem: true, vuaKhung: khungVe,
    thoiGian: function (P) { return kbVe(P).tong * 1000; }, ghiChu: function (P, ts, t) { return kbVe(P).ghi(t); } };
}
function kbVe(P) {
  var q = dinh(P), A = q.A, B = q.B, C = q.C, Dd = q.D, O = O0, d1 = H.dai(A, C), d2 = H.dai(B, Dd), n = 0, L = Math.max(d2 * 0.55, 1.6) + 0.8;
  var nn = donVi(H.tru(B, O)), X = H.cong(O, H.nhan(nn, d2 / 2 + 1)), Y = H.tru(O, H.nhan(nn, d2 / 2 + 1));
  var qO = { A: A, B: B, C: C, D: Dd, O: O };
  function Bc(t) { n++; return '<b>Bước ' + n + '.</b> ' + t; }
  return KhungPhang.kichBan([
    D.doanChia(C, A, { ghi: Bc('Dùng thước thẳng có vạch chia vẽ đường chéo $AC = ' + soL(d1) + '$ cm.'), sau: function (g) { tenVe(g, q, 'AC', O); } }),
    D.doDoan(C, O, { ben: -1, ghi: Bc('Dùng thước đánh dấu trung điểm $O$ của $AC$: $OA = OC = ' + soL(d1 / 2) + '$ cm.'), sau: function (g) { g.diem(O, 'O', { huong: donVi([nn[0] - 0.7 * nn[1], nn[1] + 0.7 * nn[0]]).map(function (x) { return -x; }) }); } }),
    D.datEke(O, H.huong(O, A), 1, { loai: 'vuong', dai: L, ghi: Bc('Đặt ê ke sao cho đỉnh góc vuông trùng với $O$, một cạnh góc vuông nằm trên $OA$.') }),
    D.keTheoEke(O, H.huong(O, A), 1, X, { loai: 'vuong', dai: L, net: TIA, ghi: 'Kẻ tia $Ox \\perp AC$ theo cạnh góc vuông còn lại.',
      sau: function (g) { tenTia(g, X, 'x', O); g.goc(A, O, X, { mau: MAU_GOC_VE, r: 14, nhan: false }); } }),
    D.doan(O, Y, { net: TIA, ghi: 'Dùng thước kéo dài về phía đối diện được tia $Oy$: đường thẳng $xy \\perp AC$ tại $O$.', sau: function (g) { tenTia(g, Y, 'y', O); } }),
    D.doDoan(O, B, { ben: 1, ghi: Bc('Trên tia $Ox$ dùng thước đánh dấu điểm $B$ sao cho $OB = ' + soL(d2 / 2) + '$ cm.'), sau: function (g) { tenVe(g, q, 'B', O); } }),
    D.doDoan(O, Dd, { ben: -1, ghi: Bc('Trên tia $Oy$ đánh dấu điểm $D$ sao cho $OD = OB = ' + soL(d2 / 2) + '$ cm.'), sau: function (g) { tenVe(g, q, 'D', O); } }),
    D.doan(A, B, { tg: 0.7, ghi: Bc('Dùng thước thẳng nối lần lượt $AB$, $BC$, $CD$, $DA$.') }),
    D.doan(B, C, { tg: 0.7 }), D.doan(C, Dd, { tg: 0.7 }), D.doan(Dd, A, { tg: 0.7 }),
    D.hien(function (g) {
      g.daGiac([A, B, C, Dd], { to: '#93C5FD', doMoTo: 0.35, rong: 0 });
      g.doan(A, C, { mau: M.duongCheo, rong: 2, dut: '6 4' }); g.doan(B, Dd, { mau: M.duongCheo, rong: 2, dut: '6 4' });
      [[A, B], [B, C], [C, Dd], [Dd, A]].forEach(function (c) { g.doan(c[0], c[1], { mau: M1, rong: 3.5, kyHieu: 1 }); });
      g.goc(A, O, B, { mau: MAU_GOC_VE, r: 14, nhan: false });
      tenVe(g, q, 'ABCD', O);
    }, { tg: 1.3, ghi: 'Ta được <b>hình thoi $ABCD$</b>: bốn cạnh bằng nhau, hai đường chéo vuông góc và cắt nhau tại trung điểm $O$ của mỗi đường.' }),
  ]);
}
function khungVe(P) {
  var q = dinh(P), nn = donVi(H.tru(q.B, O0)), d2 = H.dai(q.B, q.D), L = Math.max(d2 * 0.55, 1.6) + 0.8;
  return [q.A, q.B, q.C, q.D, H.cong(O0, H.nhan(nn, d2 / 2 + 1.4)), H.tru(O0, H.nhan(nn, d2 / 2 + 1.4)), H.cong(O0, H.nhan(donVi(q.A), L)), H.cong(q.A, H.nhan(donVi(q.A), 0.8)), H.cong(q.C, H.nhan(donVi(q.C), 0.8))];
}
function info(P) { var q = dinh(P); return { ten: 'Hình thoi', ds: [q.A, q.B, q.C, q.D], tam: O0, truc: [[q.A, q.C], [q.B, q.D]] }; }

KhungPhang.tao({
  ten: 'Hình thoi',
  lop: 8,
  diem: { A: [3.5, 0], B: [0, 2] },
  buocLuoi: 0.5,
  rangBuoc: {
    A: function (p) { return H.dai(p, O0) < 1 ? null : p; },
    B: function (p, P) { var n = phap(P), k = Math.max(0.6, p[0] * n[0] + p[1] * n[1]); return H.nhan(n, k); },
  },
  sauKeo: function (ten, P) { if (ten === 'A') P.B = H.nhan(phap(P), H.dai(P.B, O0)); },
  batDau: ['canh'],

  lamSang: [
    { id: 'canh', nhan: 'Bốn cạnh bằng nhau', mau: M1, ghiChu: function (P) { return 'Hình thoi là tứ giác có <b>bốn cạnh bằng nhau</b>: $AB = BC = CD = DA \\approx ' + soL(H.dai(P.A, P.B)) + '$ cm. Hình thoi cũng là một hình bình hành.'; } },
    { id: 'cheo', nhan: 'Hai đường chéo vuông góc', mau: M.duongCheo, ghiChu: 'Trong hình thoi, <b>hai đường chéo vuông góc với nhau</b> (và cắt nhau tại trung điểm mỗi đường).' },
    { id: 'pg', nhan: 'Đường chéo là phân giác', mau: MG1, ghiChu: 'Trong hình thoi, <b>hai đường chéo là các đường phân giác của các góc</b> của hình thoi.' },
  ],
  hoatHinh: [
    nutVe('Vẽ bằng thước thẳng và ê ke'),
    { id: 'gap', nhan: 'Gấp theo đường chéo AC', thoiGian: 4200,
      ghiChu: function (P, ts, t) { return t < 1 ? 'Gấp hình thoi theo đường chéo $AC$…' : 'Hai nửa trùng khít: $B$ trùng $D$. Đường chéo là <b>trục đối xứng</b> và là <b>phân giác</b> các góc $A$, $C$.'; } },
  ],

  ve: function (g, P) {
    var q = dinh(P), f = info(P), tv = g.hoat('ve');
    if (tv !== null) { kbVe(P).ve(g, tv); return; }
    if (g.hoat('gap') !== null) { DX.ve(g, f, { truc: 0 }); return; }
    g.daGiac(f.ds, { to: '#93C5FD', doMoTo: 0.22, rong: 0 });
    var opg = g.bat('pg');
    if (g.bat('cheo') || opg) TG.cheo(g, q, { sang: 'cheo', trung: true, vuong: g.bat('cheo') });
    var oc = g.bat('canh');
    TG.canh(q).forEach(function (c) { veCanh(g, c[0], c[1], oc, M1, 1); });
    if (opg) {
      [[q.D, q.A, q.C, q.B], [q.A, q.B, q.D, q.C], [q.B, q.C, q.A, q.D], [q.C, q.D, q.B, q.A]].forEach(function (x, i) {
        var mau = i % 2 ? MG2 : MG1;
        g.goc(x[0], x[1], x[2], { mau: mau, r: 30, kyHieu: i % 2 + 1, doMoTo: 0.3, nhan: false });
        g.goc(x[2], x[1], x[3], { mau: mau, r: 30, kyHieu: i % 2 + 1, doMoTo: 0.3, nhan: false });
      });
    }
    TG.nhanDinh(g, q);
  },

  nhanXet: function (P) {
    var q = dinh(P), r = 'Hình thoi $ABCD$: cạnh $\\approx ' + soL(H.dai(q.A, q.B)) + '$ ; $AC = ' + soL(H.dai(q.A, q.C)) + '$, $BD = ' + soL(H.dai(q.B, q.D)) + '$';
    if (H.bang(H.dai(q.A, q.C), H.dai(q.B, q.D))) r += '<br><span class="dung">Hai đường chéo bằng nhau → hình vuông!</span>';
    return r + TG.dauHieu('Dấu hiệu nhận biết hình thoi', ['Tứ giác có <b>bốn cạnh bằng nhau</b>.', 'Hình bình hành có <b>hai cạnh kề bằng nhau</b>.', 'Hình bình hành có <b>hai đường chéo vuông góc</b>.', 'Hình bình hành có <b>một đường chéo là đường phân giác của một góc</b>.']);
  },
  congThuc: function (P, ts, C) { var d1 = 2 * H.dai(P.A, O0), d2 = 2 * H.dai(P.B, O0); return [{ id: 'cheo', ten: 'Tính chất', bt: '${' + C.m('canh', 'AB = BC = CD = DA') + '}$ ; ${' + C.m('cheo', 'AC \\perp BD') + '}$' }, { id: null, ten: 'Diện tích', bt: '$S = \\dfrac{AC\\cdot BD}{2} = \\dfrac{' + soL(d1) + '\\cdot ' + soL(d2) + '}{2} = \\mathbf{' + soL(d1 * d2 / 2) + '}$ (cm²)' }]; },
  khungNhin: function (P) { var q = dinh(P); return [q.C, q.D]; },
});
</script>
</body>
</html>
