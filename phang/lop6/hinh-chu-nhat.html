<!doctype html>
<html lang="vi">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hình chữ nhật</title>
<link rel="stylesheet" href="../../chung/giao-dien.css">
<link rel="stylesheet" href="../../chung/khung-3d.css">
<link rel="stylesheet" href="../../chung/khung-phang.css">
<script src="../../chung/cau-hinh.js"></script>
<script src="../../chung/dang-nhap.js" data-goc="../../"></script>
</head>
<body>
<div id="thanh-tren"></div>
<div id="mo-hinh"></div>

<script src="../../chung/khung-phang.js"></script>
<script>
/* =====================================================================
   HÌNH CHỮ NHẬT ABCD — Toán 6
   Nhận dạng (góc vuông, cạnh đối, đường chéo), chu vi, diện tích,
   vẽ bằng thước và ê ke, tính đối xứng (2 trục, có tâm).
   A cố định ở góc dưới trái, kéo C để đổi chiều dài và chiều rộng.
   ===================================================================== */
var H = KhungPhang.H, so = KhungPhang.so, M = KhungPhang.MAU, DX = KhungPhang.doiXung, CV = KhungPhang.chuVi, D = KhungPhang.dung;
var soL = KhungPhang.soL;
var MAU_CANH = '#2563EB', MAU_GOC = '#16A34A', MAU_CHEO = '#C026D3', MAU_DOI1 = M.chieuDai, MAU_DOI2 = M.chieuRong;
function dinh(P) { var A = P.A, C = P.C; return { A: A, B: [C[0], A[1]], C: C, D: [A[0], C[1]] }; }
function kichThuoc(P) { return { a: P.C[0] - P.A[0], b: P.C[1] - P.A[1] }; }
function thongTin(P) {
  var q = dinh(P), vuong = H.bang(q.B[0] - q.A[0], q.D[1] - q.A[1]);
  var truc = [[H.trung(q.A, q.B), H.trung(q.D, q.C)], [H.trung(q.D, q.A), H.trung(q.B, q.C)]];
  if (vuong) truc.push([q.A, q.C], [q.B, q.D]);
  return { ten: vuong ? 'Hình chữ nhật này (là hình vuông)' : 'Hình chữ nhật', ds: [q.A, q.B, q.C, q.D], tam: H.trung(q.A, q.C), truc: truc };
}
function tenDinh(g, q, chi) {
  var huong = { A: [-1, -1], B: [1, -1], C: [1, 1], D: [-1, 1] };
  (chi || 'ABCD').split('').forEach(function (k) { g.diem(q[k], k, { huong: huong[k] }); });
}
function gocVuong(g, q, dinhs, o) {
  o = o || {};
  var ke = { A: ['B', 'D'], B: ['C', 'A'], C: ['D', 'B'], D: ['A', 'C'] };
  dinhs.split('').forEach(function (k) { g.goc(q[ke[k][0]], q[k], q[ke[k][1]], { mau: o.mau || '#1B2540', sang: o.sang, r: o.r || 16, nhan: o.nhan || false, xaNhan: 14 }); });
}

/* ---------- Vẽ hình chữ nhật bằng thước và ê ke ---------- */
function kbVe(P) {
  var q = dinh(P), k = kichThuoc(P), A = q.A, B = q.B, C = q.C, Dd = q.D, n = 0, L = Math.max(k.a, k.b) * 0.75 + 1;
  var aAB = H.huong(A, B), aBA = H.huong(B, A);
  var X = H.lerp(B, C, 1 + 1.2 / k.b), Y = H.lerp(A, Dd, 1 + 1.2 / k.b), tia = { rong: 2, mau: '#475569' };
  function Bc(t) { n++; return '<b>Bước ' + n + '.</b> ' + t; }
  return KhungPhang.kichBan([
    D.doanChia(A, B, { ghi: Bc('Dùng thước vẽ đoạn thẳng $AB = ' + soL(k.a) + '$ cm (chiều dài).'), sau: function (g) { tenDinh(g, q, 'AB'); } }),
    D.datEke(B, aBA, -1, { loai: 'vuong', dai: L, ghi: Bc('Đặt ê ke sao cho đỉnh góc vuông trùng với $B$, một cạnh góc vuông nằm trên $BA$.') }),
    D.keTheoEke(B, aBA, -1, X, { loai: 'vuong', dai: L, net: tia, ghi: 'Kẻ tia $Bx$ theo cạnh góc vuông còn lại: $Bx \\perp AB$.',
      sau: function (g) { g.chu(X, 'x', { mau: '#475569', dx: 10, nghieng: true }); g.goc(A, B, X, { mau: MAU_GOC, r: 16, nhan: false }); } }),
    D.doDoan(B, C, { ben: 1, ghi: Bc('Đặt thước dọc theo tia $Bx$ (vạch 0 tại $B$), đánh dấu điểm $C$ sao cho $BC = ' + soL(k.b) + '$ cm (chiều rộng).'),
      sau: function (g) { g.diem(C, 'C', { huong: [1, 1], mau: '#0D9488' }); } }),
    D.datEke(A, aAB, 1, { loai: 'vuong', dai: L, ghi: Bc('Đặt ê ke tại $A$: đỉnh góc vuông trùng với $A$, một cạnh góc vuông nằm trên $AB$.') }),
    D.keTheoEke(A, aAB, 1, Y, { loai: 'vuong', dai: L, net: tia, ghi: 'Kẻ tia $Ay \\perp AB$.',
      sau: function (g) { g.chu(Y, 'y', { mau: '#475569', dx: -10, nghieng: true }); g.goc(B, A, Y, { mau: MAU_GOC, r: 16, nhan: false }); } }),
    D.doDoan(A, Dd, { ben: -1, ghi: Bc('Trên tia $Ay$ đánh dấu điểm $D$ sao cho $AD = ' + soL(k.b) + '$ cm.'),
      sau: function (g) { g.diem(Dd, 'D', { huong: [-1, 1], mau: '#0D9488' }); } }),
    D.doan(Dd, C, { ghi: Bc('Dùng thước nối $D$ với $C$.') }),
    D.doan(B, C, { tg: 0.5, ghi: 'Tô đậm các cạnh $BC$, $AD$.' }),
    D.doan(A, Dd, { tg: 0.5 }),
    D.hien(function (g) {
      g.daGiac([A, B, C, Dd], { to: '#93C5FD', doMoTo: 0.35, rong: 0 });
      [[A, B, 1, MAU_DOI1], [Dd, C, 1, MAU_DOI1], [B, C, 2, MAU_DOI2], [A, Dd, 2, MAU_DOI2]].forEach(function (c) { g.doan(c[0], c[1], { mau: c[3], rong: 3.5, kyHieu: c[2] }); });
      gocVuong(g, q, 'ABCD', { mau: MAU_GOC }); tenDinh(g, q);
    }, { tg: 1.3, ghi: 'Ta được <b>hình chữ nhật $ABCD$</b>: bốn góc vuông, các cạnh đối bằng nhau.' }),
  ]);
}

KhungPhang.tao({
  ten: 'Hình chữ nhật',
  lop: 6,
  diem: { A: [0, 0], C: [5, 3] },
  coDinh: ['A'],
  buocLuoi: 1,
  rangBuoc: { C: function (p) { return [Math.max(1, p[0]), Math.max(1, p[1])]; } },
  luaChon: [DX.luaChonTruc(2)],
  hopChon: [DX.hopChonVet],
  tieuDeSang: 'Chú thích · bấm để làm nổi bật',

  lamSang: [
    { id: 'canh', nhan: 'Cạnh', mau: MAU_CANH,
      ghiChu: function (P) { var k = kichThuoc(P); return 'Hình chữ nhật có bốn cạnh: $AB = CD = ' + soL(k.a) + '$ cm (chiều dài), $AD = BC = ' + soL(k.b) + '$ cm (chiều rộng).'; } },
    { id: 'goc', nhan: 'Góc vuông', mau: MAU_GOC,
      ghiChu: 'Hình chữ nhật có <b>bốn góc bằng nhau</b> và <b>bằng $90^\\circ$</b>.' },
    { id: 'cheo', nhan: 'Đường chéo', mau: MAU_CHEO,
      ghiChu: function (P) { var k = kichThuoc(P); return 'Hình chữ nhật có <b>hai đường chéo bằng nhau</b>: $AC = BD \\approx ' + soL(Math.hypot(k.a, k.b)) + '$ cm; chúng cắt nhau tại trung điểm $O$ của mỗi đường.'; } },
    { id: 'doi', nhan: 'Hai cạnh đối', mau: '#7C3AED',
      ghiChu: function (P) { var k = kichThuoc(P); return '<b>Các cạnh đối bằng nhau</b> và <b>song song</b>: $AB = CD = ' + soL(k.a) + '$ cm, $AB \\parallel CD$; $AD = BC = ' + soL(k.b) + '$ cm, $AD \\parallel BC$.'; } },
  ].concat(CV.lamSang({
    cv: function (P) { var k = kichThuoc(P); return 'Chu vi = 2 × (chiều dài + chiều rộng) $= 2 \\cdot (' + soL(k.a) + ' + ' + soL(k.b) + ') = \\mathbf{' + soL(2 * (k.a + k.b)) + '}$ <b>cm</b>.'; },
    dt: function (P) { var k = kichThuoc(P); return 'Diện tích = chiều dài × chiều rộng $= ' + soL(k.a) + ' \\cdot ' + soL(k.b) + ' = \\mathbf{' + soL(k.a * k.b) + '}$ <b>cm²</b>.'; },
  })).concat(DX.lamSang(thongTin)),

  hoatHinh: [
    { id: 've', nhan: 'Vẽ bằng thước và ê ke', anDiem: true,
      vuaKhung: function (P) { var q = dinh(P), k = kichThuoc(P), L = Math.max(k.a, k.b) * 0.75 + 1; return [H.cong(q.C, [0, 1.6]), H.cong(q.D, [0, 1.6]), [q.B[0] - L, q.B[1]], [q.A[0], q.A[1] + L]]; },
      thoiGian: function (P) { return kbVe(P).tong * 1000; }, ghiChu: function (P, ts, t) { return kbVe(P).ghi(t); } },
    { id: 'dem', nhan: 'Đếm ô vuông 1 cm²', thoiGian: 5500,
      ghiChu: function (P, ts, t) {
        var a = Math.round(P.C[0] - P.A[0]), b = Math.round(P.C[1] - P.A[1]), n = Math.min(a * b, Math.floor(t * a * b + 1e-9));
        return 'Đã đếm <b>' + n + '</b> ô vuông 1 cm²' + (n >= a * b ? ' — mỗi hàng ' + a + ' ô, có ' + b + ' hàng: <b>$' + a + ' \\cdot ' + b + ' = ' + a * b + '$ cm²</b>.' : '…');
      } },
  ].concat(DX.hoatHinh(thongTin)),

  ve: function (g, P, ts) {
    var q = dinh(P), f = thongTin(P), t = g.hoat('dem'), hoat = DX.dangHoat(g), k = kichThuoc(P), a = k.a, b = k.b;
    var tv = g.hoat('ve');
    if (tv !== null) { kbVe(P).ve(g, tv); return; }
    if (!hoat) {
      g.daGiac(f.ds, { to: t !== null ? 'none' : undefined });
      if (t !== null) g.oVuong(q.A[0], q.A[1], Math.round(a), Math.round(b), Math.floor(t * Math.round(a) * Math.round(b) + 1e-9));
    }
    DX.ve(g, f, ts);
    if (hoat) return;
    var O = H.trung(q.A, q.C);
    if (g.bat('cheo')) {
      g.doan(q.A, q.C, { sang: 'cheo', rongSang: 4 }); g.doan(q.B, q.D, { sang: 'cheo', rongSang: 4 });
      [q.A, q.B, q.C, q.D].forEach(function (p) { g.kyHieu(O, p, 2, MAU_CHEO); });
      g.nhanDo(q.A, q.B, 'AC = BD ≈ ' + so(Math.hypot(a, b)) + ' cm', { sang: 'cheo', benTrai: false, kc: 62 });
      g.diem(O, 'O', { mau: MAU_CHEO, huong: [0, -1] });
    }
    if (g.bat('doi')) {
      [[q.A, q.B, 1, MAU_DOI1], [q.D, q.C, 1, MAU_DOI1], [q.A, q.D, 2, MAU_DOI2], [q.B, q.C, 2, MAU_DOI2]].forEach(function (c) { g.doan(c[0], c[1], { mau: c[3], rong: 5, kyHieu: c[2] }); });
    }
    if (g.bat('canh')) [[q.A, q.B, 'AB = ' + so(a)], [q.B, q.C, 'BC = ' + so(b)], [q.C, q.D, 'CD = ' + so(a)], [q.D, q.A, 'DA = ' + so(b)]].forEach(function (c) {
      if (!g.bat('doi')) g.doan(c[0], c[1], { sang: 'canh' });
      g.nhanDo(c[0], c[1], c[2] + ' cm', { sang: 'canh', benTrai: false, kc: 'tu' });
    });
    if (g.bat('goc')) gocVuong(g, q, 'ABCD', { sang: 'goc', r: 22, nhan: '90°' });
    else gocVuong(g, q, 'A', { r: 16 });
    var tA = '\\textcolor{' + M.chieuDai + '}{a}', tB = '\\textcolor{' + M.chieuRong + '}{b}';
    CV.ve(g, { ds: f.ds,
      canh: [{ A: q.A, B: q.B, nhan: 'a = ' + so(a) + ' cm', mau: M.chieuDai }, { A: q.B, B: q.C, nhan: 'b = ' + so(b) + ' cm', mau: M.chieuRong },
             { A: q.C, B: q.D, nhan: 'a = ' + so(a) + ' cm', mau: M.chieuDai }, { A: q.D, B: q.A, nhan: 'b = ' + so(b) + ' cm', mau: M.chieuRong }],
      cv: ['C = 2 \\cdot (' + tA + ' + ' + tB + ')', '\\phantom{C} = 2 \\cdot (' + soL(a) + ' + ' + soL(b) + ')', '\\phantom{C} = \\mathbf{' + soL(2 * (a + b)) + '}\\ \\text{cm}'],
      dt: ['S = ' + tA + ' \\cdot ' + tB, '\\phantom{S} = ' + soL(a) + ' \\cdot ' + soL(b), '\\phantom{S} = \\mathbf{' + soL(a * b) + '}\\ \\text{cm}^2'],
      phuDt: function (g, e) { if (e > 0) { g.doan(q.A, q.B, { mau: M.chieuDai, rong: 5 }); g.doan(q.B, q.C, { mau: M.chieuRong, rong: 5 }); } } });
    if (!g.bat('cv') && !g.bat('canh')) {
      g.nhanDo(q.A, q.B, 'a = ' + so(a) + ' cm', { benTrai: false, mau: M.chieuDai });
      g.nhanDo(q.B, q.C, 'b = ' + so(b) + ' cm', { benTrai: false, mau: M.chieuRong, kc: 'tu' });
    }
    tenDinh(g, q);
  },

  congThuc: function (P) {
    var k = kichThuoc(P), a = k.a, b = k.b, A = '\\textcolor{' + M.chieuDai + '}{a}', B = '\\textcolor{' + M.chieuRong + '}{b}';
    return [
      { id: 'cv', ten: 'Chu vi', bt: '$C = 2(' + A + ' + ' + B + ') = 2(' + soL(a) + ' + ' + soL(b) + ') = \\mathbf{' + soL(2 * (a + b)) + '}$ (cm)' },
      { id: 'dt', ten: 'Diện tích', bt: '$S = ' + A + ' \\cdot ' + B + ' = ' + soL(a) + ' \\cdot ' + soL(b) + ' = \\mathbf{' + soL(a * b) + '}$ (cm²)' },
    ];
  },
  nhanXet: function (P) {
    var k = kichThuoc(P);
    function dong(mau, td, ct) { return '<div style="margin:3px 0 2px">• <b style="color:' + mau + '">' + td + '</b>:<br><span style="padding-left:14px">' + ct + '</span></div>'; }
    return '<b>Hình chữ nhật $ABCD$</b> có:' +
      dong(MAU_GOC, 'Bốn góc bằng nhau và bằng $90^\\circ$', '$\\widehat{A} = \\widehat{B} = \\widehat{C} = \\widehat{D} = 90^\\circ$') +
      dong('#7C3AED', 'Các cạnh đối bằng nhau', '$AB = CD = ' + soL(k.a) + '$ cm; $AD = BC = ' + soL(k.b) + '$ cm') +
      dong(MAU_CHEO, 'Hai đường chéo bằng nhau', '$AC = BD \\approx ' + soL(Math.hypot(k.a, k.b)) + '$ cm') +
      '<div style="height:4px"></div>' + DX.nhanXet(thongTin(P)) + '<br><span class="dung">Kéo điểm C để đổi kích thước.</span>';
  },
  khungNhin: function (P, ts, bat) { var q = dinh(P), ds = [q.A, q.B, q.C, q.D]; return ds.concat(CV.khungNhin(ds, bat)); },
});
</script>
</body>
</html>
