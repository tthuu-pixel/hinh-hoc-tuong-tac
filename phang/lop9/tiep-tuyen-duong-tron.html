<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiếp tuyến của đường tròn</title>
<link rel="stylesheet" href="../../chung/giao-dien.css">
<link rel="stylesheet" href="../../chung/khung-3d.css">
<link rel="stylesheet" href="../../chung/khung-phang.css">
<script src="../../chung/cau-hinh.js"></script>
<script src="../../chung/dang-nhap.js" data-goc="../../"></script>
</head>
<body>
<div id="thanh-tren"></div>
<div id="mo-hinh"></div>

<script src="../../chung/thanh-chia.js"></script>
<script src="../../chung/khung-phang.js"></script>
<script>
/* =====================================================================
   TIẾP TUYẾN CỦA ĐƯỜNG TRÒN — Toán 9
   Tính chất: tiếp tuyến vuông góc với bán kính tại tiếp điểm;
   khoảng cách từ tâm O đến tiếp tuyến bằng bán kính R.
   Cách vẽ: (1) qua một điểm A trên đường tròn; (2) qua một điểm M ở ngoài
   đường tròn (bằng compa và thước, hoặc chỉ bằng thước thẳng).
   ===================================================================== */
var H = KhungPhang.H, so = KhungPhang.so, soL = KhungPhang.soL, D = KhungPhang.dung;
var O0 = [0, 0], R = 2.5, RAD = Math.PI / 180;
var MT = '#1E6FE0', MV = '#16A34A', MR = '#E0342F', MI = '#0D9488', MN = '#7C3AED';
function diemDT(a) { return [R * Math.cos(a), R * Math.sin(a)]; }
function lenDT(p) { var d = H.dai(p, O0); if (d < 1e-6) return null; var a = Math.round(Math.atan2(p[1], p[0]) / RAD) * RAD; return diemDT(a); }
function laTren(P, ts) { return ts.che === 'tren'; }
function laNgoai(P, ts) { return ts.che === 'ngoai'; }
function keo(M, X, k) { return H.cong(M, H.nhan(H.tru(X, M), 1 + k / H.dai(M, X))); }

// Trường hợp 1: tiếp tuyến tại điểm A trên đường tròn
function tai(A) {
  var u = H.nhan(A, 1 / R), v = [-u[1], u[0]], L = 3.6;
  return { A: A, u: u, v: v, d1: H.cong(A, H.nhan(v, L)), d2: H.cong(A, H.nhan(v, -L)) };
}
// Trường hợp 2: hai tiếp tuyến kẻ từ M ở ngoài đường tròn
function tu(M) {
  var d = H.dai(M, O0), th = Math.atan2(M[1], M[0]), ph = Math.acos(R / d);
  return { M: M, d: d, A: diemDT(th + ph), B: diemDT(th - ph), dai: Math.sqrt(d * d - R * R) };
}
function huongNhan(P) { return H.nhan(P, 1); }

/* ---------- Bước cuối chung: kí hiệu vuông góc, OA = R ---------- */
function buocTinhChat(ds, ghiVg) {
  // ds: [{ T: tiếp điểm, X: điểm trên tiếp tuyến, ten }]
  return [
    D.hien(function (g) { ds.forEach(function (o) { g.doan(O0, o.T, { mau: MV, rong: 2.4 }); g.goc(O0, o.T, o.X, { mau: MV, r: 13 }); }); }, { tg: 1.6, ghi: ghiVg }),
    D.hien(function (g) { ds.forEach(function (o) { g.doan(O0, o.T, { mau: MR, rong: 4 }); g.nhanDo(O0, o.T, 'R', { mau: MR }); }); }, { tg: 1.6,
      ghi: '<b>Khoảng cách từ tâm đến tiếp tuyến bằng bán kính:</b> $' + ds.map(function (o) { return 'O' + o.ten + ' = R'; }).join('$, $') + '$. Tiếp tuyến chỉ có <b>một điểm chung</b> với đường tròn.' }),
  ];
}

/* ---------- Cách vẽ 1: tiếp tuyến tại A (compa và thước) ---------- */
function kbTai(P) {
  var q = tai(P.A), A = q.A, u = q.u, v = q.v, r1 = 1.1, r2 = 1.9;
  var E = H.cong(A, H.nhan(u, -r1)), F = H.cong(A, H.nhan(u, r1)), h = Math.sqrt(r2 * r2 - r1 * r1);
  var P1 = H.cong(A, H.nhan(v, h)), P2 = H.cong(A, H.nhan(v, -h));
  var aE = Math.atan2(u[1], u[0]) + Math.PI, aF = aE - Math.PI;
  var bE1 = H.huong(E, P1), bE2 = H.huong(E, P2), bF1 = H.huong(F, P1), bF2 = H.huong(F, P2), w = 0.32;
  var chamEF = function (g) { g.diem(E, 'E', { r: 3.5, mau: MI, huong: H.cong(H.nhan(v, -1), H.nhan(u, -0.3)) }); g.diem(F, 'F', { r: 3.5, mau: MI, huong: H.cong(H.nhan(v, -1), H.nhan(u, 0.3)) }); };
  var net = { mau: MI, rong: 1.8 };
  return KhungPhang.kichBan([
    D.hien(function (g) { g.diem(A, 'A', { huong: H.cong(u, H.nhan(v, -0.6)) }); }, { tg: 0.8, ghi: '<b>Bước 1.</b> Lấy điểm $A$ trên đường tròn $(O)$.' }),
    D.doan(O0, H.cong(A, H.nhan(u, 2)), { ghi: 'Dùng thước kẻ <b>tia $OA$</b> (kéo dài bán kính $OA$ ra ngoài đường tròn).', net: { mau: '#475569', rong: 2 } }),
    D.doCompa(A, E, { ghi: '<b>Bước 2.</b> Đặt mũi kim compa tại $A$, mở compa một khoảng nhỏ.' }),
    D.cung(A, r1, aE - 0.3, aE + 0.3, { tg: 0.8, ghi: 'Vạch cung cắt tia $OA$ tại $E$ (phía trong đường tròn)…', net: net }),
    D.xoayCompa(A, r1, aE + 0.3, aF - 0.3, { tg: 0.7 }),
    D.cung(A, r1, aF - 0.3, aF + 0.3, { tg: 0.8, ghi: '…và tại $F$ (phía ngoài): $AE = AF$.', net: net, sau: chamEF }),
    D.chuyenCompa(A, H.cong(A, H.nhan(u, r1)), E, H.cong(E, [r2 * Math.cos(bE1), r2 * Math.sin(bE1)]), { ghi: '<b>Bước 3.</b> Mở compa rộng hơn $AE$, đặt mũi kim tại $E$.' }),
    D.cung(E, r2, bE1 - w, bE1 + w, { tg: 0.7, ghi: 'Vạch một cung về phía trên…', net: net }),
    D.xoayCompa(E, r2, bE1 + w, bE2 - w, { tg: 0.6 }),
    D.cung(E, r2, bE2 - w, bE2 + w, { tg: 0.7, ghi: '…và một cung về phía dưới.', net: net }),
    D.chuyenCompa(E, H.cong(E, [r2 * Math.cos(bE2), r2 * Math.sin(bE2)]), F, H.cong(F, [r2 * Math.cos(bF1), r2 * Math.sin(bF1)]), { ghi: 'Giữ nguyên độ mở, chuyển mũi kim sang $F$.' }),
    D.cung(F, r2, bF1 - w, bF1 + w, { tg: 0.7, ghi: 'Vạch hai cung cắt hai cung trước tại $P$ và $Q$.', net: net }),
    D.xoayCompa(F, r2, bF1 + w, bF2 - w, { tg: 0.6 }),
    D.cung(F, r2, bF2 - w, bF2 + w, { tg: 0.7, net: net,
      sau: function (g) { g.diem(P1, 'P', { r: 3.5, mau: MI, huong: v }); g.diem(P2, 'Q', { r: 3.5, mau: MI, huong: H.nhan(v, -1) }); } }),
    D.doan(q.d2, q.d1, { tg: 1.4, ghi: '<b>Bước 4.</b> Dùng thước kẻ đường thẳng $PQ$ (đi qua $A$): đó là <b>tiếp tuyến</b> $d$ của $(O)$ tại $A$.', net: { mau: MT, rong: 3.5 },
      sau: function (g) { g.chu(H.cong(q.d1, H.nhan(v, 0.35)), 'd', { mau: MT, nghieng: true }); } }),
  ].concat(buocTinhChat([{ T: A, X: q.d1, ten: 'A' }], '<b>Kí hiệu vuông góc:</b> $d \\perp OA$ tại $A$ (vì $PQ$ là đường trung trực của $EF$).')));
}

/* ---------- Cách vẽ 2a: từ M ở ngoài, bằng compa và thước ---------- */
function kbCompa(P) {
  var q = tu(P.M), M = q.M, A = q.A, B = q.B, I = H.trung(O0, M), r = q.d / 2;
  return KhungPhang.kichBan([
    D.hien(function (g) { g.diem(M, 'M', { huong: [0.4, 1] }); }, { tg: 0.8, ghi: '<b>Bước 1.</b> Điểm $M$ nằm ngoài đường tròn $(O)$.' }),
    D.doan(O0, [M[0] + 1.3, 0], { ghi: 'Từ tâm $O$ dùng thước kẻ đường thẳng <b>nằm ngang</b> đi qua $M$.', net: { mau: '#475569', rong: 2 } }),
    D.hien(function (g) { g.diem(I, 'I', { r: 4, mau: MI, huong: [0, -1] }); }, { tg: 0.9, ghi: '<b>Bước 2.</b> Lấy trung điểm $I$ của $OM$ ($OI = IM \\approx ' + soL(r) + '$ cm, lớn hơn bán kính một chút).' }),
    D.doCompa(I, O0, { tg: 1.3, ghi: 'Đặt <b>mũi kim compa</b> tại $I$, <b>đầu bút chì</b> đặt đúng tâm $O$.' }),
    D.cung(I, r, Math.PI, 3 * Math.PI, { tg: 2.4, ghi: 'Quay compa vẽ đường tròn mờ tâm $I$ bán kính $IO$ (đi qua $O$ và $M$). Đường tròn này cắt $(O)$ tại hai điểm $A$ và $B$.',
      net: { mau: MI, rong: 1.6, dut: '6 5' }, sau: function (g) { g.diem(A, 'A', { mau: MI, huong: A }); g.diem(B, 'B', { mau: MI, huong: B }); } }),
    D.doan(M, keo(M, A, 1.2), { ghi: '<b>Bước 3.</b> Dùng thước nối $M$ với $A$ và kéo dài: $MA$ là tiếp tuyến.', net: { mau: MT, rong: 3.5 } }),
    D.doan(M, keo(M, B, 1.2), { ghi: 'Nối $M$ với $B$: từ $M$ kẻ được <b>hai tiếp tuyến</b> $MA$, $MB$.', net: { mau: MT, rong: 3.5 } }),
  ].concat(buocTinhChat([{ T: A, X: M, ten: 'A' }, { T: B, X: M, ten: 'B' }],
    '<b>Kí hiệu vuông góc:</b> $MA \\perp OA$, $MB \\perp OB$ (vì $\\widehat{OAM}$, $\\widehat{OBM}$ là góc nội tiếp chắn nửa đường tròn $(I)$).')));
}

/* ---------- Cách vẽ 2b: từ M ở ngoài, chỉ bằng thước thẳng ---------- */
function kbThuoc(P) {
  var q = tu(P.M), M = q.M, A = q.A, B = q.B, L = q.dai + 1.4, lech = 0.4;
  var aA = H.huong(M, A), aB = H.huong(M, B);
  function theoGoc(a) { return [M[0] + L * Math.cos(a), M[1] + L * Math.sin(a)]; }
  function chamM(g) { g.diem(M, 'M', { huong: [0.4, 1] }); }
  function xoayThuoc(a, huong, ben, ghi) { return { tg: 1.6, ghi: ghi, cu: function (g, e) { g.thuoc(M, theoGoc(a + huong * lech * (1 - e)), { ben: ben }); } }; }
  function timTiepDiem(T, ten, ben, ghi) {
    var u = H.nhan(T, 1 / R), cuoi = H.cong(T, H.nhan(u, 0.9)), v = [-u[1], u[0]];
    var cham = function (g) { g.diem(T, ten, { huong: T }); };
    return { tg: 2.2, ghi: ghi,
      ve: function (g, e) { if (e > 0.6) { g.goc(O0, T, M, { mau: MV, r: 13 }); cham(g); } },
      xong: cham,
      cu: function (g, e) {
        var k = Math.max(0, 1 - e / 0.5), d = H.nhan(v, 1.2 * k * -ben);
        g.thuoc(H.cong(O0, d), H.cong(cuoi, d), { ben: ben, doMo: 0.4 + 0.55 * Math.min(1, e / 0.5) });
        if (e > 0.6) g.but(T);
      } };
  }
  return KhungPhang.kichBan([
    { tg: 1, ghi: '<b>Bước 1.</b> Chấm một điểm $M$ ở ngoài đường tròn $(O)$.', ve: chamM, xong: chamM, cu: function (g) { g.but(M); } },
    xoayThuoc(aA, -1, 1, '<b>Bước 2.</b> Đặt mép thước đi qua $M$, xoay thước từ từ về phía đường tròn cho tới khi mép thước <b>vừa chạm</b> đường tròn.'),
    D.doan(M, keo(M, A, 1.2), { ben: 1, ghi: 'Giữ thước, kẻ đường thẳng đi qua $M$ sát mép thước: đường thẳng này <b>tiếp xúc</b> với $(O)$.', net: { mau: MT, rong: 3.5 } }),
    xoayThuoc(aB, 1, -1, 'Làm tương tự ở phía dưới: xoay thước quanh $M$ tới khi mép thước vừa chạm đường tròn.'),
    D.doan(M, keo(M, B, 1.2), { ghi: 'Kẻ đường thẳng thứ hai: được <b>hai tiếp tuyến</b> của $(O)$ cùng đi qua $M$.', net: { mau: MT, rong: 3.5 } }),
    timTiepDiem(A, 'A', -1, '<b>Bước 3.</b> Xác định tiếp điểm: đặt thước đi qua tâm $O$ và <b>vuông góc</b> với tiếp tuyến thứ nhất. Chỗ mép thước gặp tiếp tuyến là tiếp điểm — chấm điểm $A$.'),
    timTiepDiem(B, 'B', 1, 'Đặt thước đi qua $O$ và vuông góc với tiếp tuyến thứ hai, chấm tiếp điểm $B$.'),
  ].concat(buocTinhChat([{ T: A, X: M, ten: 'A' }, { T: B, X: M, ten: 'B' }], '<b>Bước 4. Kí hiệu vuông góc:</b> $MA \\perp OA$, $MB \\perp OB$ (tiếp tuyến vuông góc với bán kính đi qua tiếp điểm).')));
}

KhungPhang.tao({
  ten: 'Tiếp tuyến của đường tròn',
  lop: 9,
  diem: { A: diemDT(50 * RAD), M: [6, 0] },
  nhapGoc: [{ id: 'AMB', ten: '\\widehat{AMB}', min: 5, max: 110, hien: laNgoai, lay: function (P) { var q = tu(P.M); return H.gocDo(q.A, q.M, q.B); },
    dat: function (P, ts, d) { P.M = [R / Math.sin(d * RAD / 2), 0]; } }],
  buocLuoi: 0.5,
  rangBuoc: { A: lenDT, M: function (p) { return [Math.max(R + 0.5, p[0]), 0]; } },
  anTayCam: function (k, P, ts) { return k === 'A' ? !laTren(P, ts) : !laNgoai(P, ts); },
  luaChon: [{ khoa: 'che', gt: 'tren', nhan: 'Vẽ tiếp tuyến', vuaKhung: true,
    ds: [{ gt: 'tren', nhan: 'Tại điểm A trên đường tròn' }, { gt: 'ngoai', nhan: 'Từ điểm M ở ngoài đường tròn' }] }],
  batDau: ['vg'],

  lamSang: [
    { id: 'vg', nhan: 'Tiếp tuyến ⊥ bán kính', mau: MV,
      ghiChu: function (P, ts) { return laTren(P, ts) ? 'Tiếp tuyến $d$ <b>vuông góc với bán kính</b> $OA$ tại tiếp điểm $A$: $d \\perp OA$.' : 'Mỗi tiếp tuyến <b>vuông góc với bán kính</b> đi qua tiếp điểm: $MA \\perp OA$, $MB \\perp OB$.'; } },
    { id: 'R', nhan: 'Khoảng cách từ O bằng R', mau: MR, lap: true,
      ghiChu: function (P, ts) { return 'Khoảng cách từ tâm $O$ đến tiếp tuyến <b>bằng bán kính</b>: $' + (laTren(P, ts) ? 'OA' : 'OA = OB') + ' = R = ' + soL(R) + '$ cm. Mọi điểm $N$ khác trên tiếp tuyến đều có $ON > R$ (nằm ngoài đường tròn).'; } },
    { id: 'dh', nhan: 'Dấu hiệu nhận biết', mau: MN, hien: laTren,
      ghiChu: 'Nếu đường thẳng $d$ <b>đi qua điểm $A$ của đường tròn</b> và <b>vuông góc với bán kính $OA$</b> thì $d$ là tiếp tuyến của đường tròn tại $A$.' },
  ],
  hoatHinh: [
    { id: 'tai', nhan: 'Vẽ tiếp tuyến tại A (compa và thước)', anDiem: true, hien: laTren,
      thoiGian: function (P) { return kbTai(P).tong * 1000; }, ghiChu: function (P, ts, t) { return kbTai(P).ghi(t); } },
    { id: 'compa', nhan: 'Vẽ tiếp tuyến từ M (compa và thước)', anDiem: true, hien: laNgoai,
      thoiGian: function (P) { return kbCompa(P).tong * 1000; }, ghiChu: function (P, ts, t) { return kbCompa(P).ghi(t); } },
    { id: 'thuoc', nhan: 'Vẽ tiếp tuyến từ M (chỉ bằng thước thẳng)', anDiem: true, hien: laNgoai,
      thoiGian: function (P) { return kbThuoc(P).tong * 1000; }, ghiChu: function (P, ts, t) { return kbThuoc(P).ghi(t); } },
  ],

  ve: function (g, P, ts) {
    g.duongTron(O0, R, { to: '#93C5FD', doMoTo: 0.2, rong: 2.8 });
    var nhanO = function () { g.diem(O0, 'O', { r: 4, huong: laTren(P, ts) ? H.nhan(P.A, -1) : [-0.4, 1] }); };
    var ht = g.hoat('tai'), hc = g.hoat('compa'), hth = g.hoat('thuoc');
    if (ht !== null) { kbTai(P).ve(g, ht); nhanO(); return; }
    if (hc !== null) { kbCompa(P).ve(g, hc); nhanO(); return; }
    if (hth !== null) { kbThuoc(P).ve(g, hth); nhanO(); return; }

    var ds;   // các tiếp tuyến: { T: tiếp điểm, X, Y: hai đầu đoạn vẽ, ten }
    if (laTren(P, ts)) { var q = tai(P.A); ds = [{ T: q.A, X: q.d1, Y: q.d2, ten: 'A', v: q.v }]; }
    else { var w = tu(P.M); ds = [{ T: w.A, X: w.M, Y: keo(w.M, w.A, 1.2), ten: 'A' }, { T: w.B, X: w.M, Y: keo(w.M, w.B, 1.2), ten: 'B' }]; }
    var oVg = g.bat('vg'), oR = g.bat('R'), oDh = g.bat('dh');
    ds.forEach(function (o) { g.doan(o.X, o.Y, { mau: MT, rong: 3 }); });
    if (laTren(P, ts)) g.chu(H.cong(ds[0].X, H.nhan(ds[0].v, 0.35)), 'd', { mau: MT, nghieng: true });
    ds.forEach(function (o) {
      if (oVg || oR || oDh) g.doan(O0, o.T, { mau: oR ? MR : oVg ? MV : MN, rong: oR ? 4 : 3 });
      if (oVg || oDh) g.goc(O0, o.T, o.X, { mau: oVg ? MV : MN, r: 14, sang: oVg ? 'vg' : 'dh' });
      if (oR) g.nhanDo(O0, o.T, 'R = ' + so(R), { mau: MR, t: 0.45 });
    });
    if (oR) {   // điểm N chạy trên tiếp tuyến thứ nhất: ON > R
      var o = ds[0], t = (g.tg('R') || 0) * 0.5, s = Math.sin(t * Math.PI), N = H.lerp(o.T, s >= 0 ? o.X : o.Y, Math.abs(s) * 0.85);
      if (H.dai(N, o.T) > 0.25) {
        g.doan(O0, N, { mau: MN, rong: 2, dut: '6 5' }); g.diem(N, 'N', { r: 4, mau: MN, huong: H.tru(N, O0) });
        g.nhanDo(O0, N, 'ON ≈ ' + so(H.dai(O0, N), 1) + ' > R', { mau: MN, t: 0.82, kc: 'tu', benTrai: H.dai(N, o.X) < H.dai(N, o.Y) === laTren(P, ts) });
      }
    }
    if (oDh) g.diem(ds[0].T, '', { r: 7, mau: MN });
    ds.forEach(function (o) { g.diem(o.T, o.ten, { huong: o.T }); });
    if (laNgoai(P, ts)) g.diem(P.M, 'M', { huong: [0.4, 1] });
    nhanO();
  },
  nhanXet: function (P, ts) {
    if (laTren(P, ts)) return 'Đường thẳng $d$ là <b>tiếp tuyến</b> của $(O)$ tại $A$ ⇔ $d$ đi qua $A \\in (O)$ và $d \\perp OA$.<br>' +
      'Khoảng cách từ $O$ đến $d$: $OA = R = ' + soL(R) + '$ cm.<br><span class="dung">Kéo điểm $A$ trên đường tròn: $d$ luôn vuông góc với $OA$.</span>';
    var q = tu(P.M);
    return 'Từ $M$ ở ngoài $(O)$ kẻ được <b>hai tiếp tuyến</b> $MA$, $MB$.<br>$OA = OB = R = ' + soL(R) + '$; $OM = ' + soL(q.d) + '$; $MA = MB \\approx ' + soL(q.dai) + '$<br>' +
      '<span class="dung">Kéo $M$ trên đường nằm ngang: $MA \\perp OA$ và $MB \\perp OB$ luôn đúng.</span>';
  },
  congThuc: function (P, ts, C) {
    return [{ id: 'vg', ten: 'Tính chất tiếp tuyến', bt: laTren(P, ts) ? '$' + C.m('vg', 'd \\perp OA') + '$ ; $' + C.m('R', 'OA = R') + '$' : '$' + C.m('vg', 'MA \\perp OA,\\ MB \\perp OB') + '$ ; $' + C.m('R', 'OA = OB = R') + '$' }];
  },
  khungNhin: function (P, ts) {
    var ds = [[-R - 0.5, -R - 0.5], [R + 0.5, R + 0.5]];
    if (laNgoai(P, ts)) ds.push([P.M[0] + 1.4, 0]); else { var q = tai(P.A); ds.push(q.d1, q.d2); }
    return ds;
  },
});
</script>
