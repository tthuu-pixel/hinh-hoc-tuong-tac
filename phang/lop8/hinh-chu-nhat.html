<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hình chữ nhật</title>
<link rel="stylesheet" href="../../chung/giao-dien.css">
<link rel="stylesheet" href="../../chung/khung-3d.css">
<link rel="stylesheet" href="../../chung/khung-phang.css">
<script src="../../chung/cau-hinh.js"></script>
<script src="../../chung/dang-nhap.js" data-goc="../../"></script>
</head>
<body>
<div id="thanh-tren"></div>
<div id="mo-hinh"></div>

<script src="../../chung/khung-phang.js"></script>
<script>
var H = KhungPhang.H, so = KhungPhang.so, M = KhungPhang.MAU, TG = KhungPhang.tuGiac, DX = KhungPhang.doiXung;
var M1 = '#E0342F', M2 = '#1E6FE0', MG1 = '#F59E0B', MG2 = '#7C3AED', MCAO = '#92400E';
function veCanh(g, P1, P2, on, mau, vach) { g.doan(P1, P2, on ? { mau: mau, rong: 5, kyHieu: vach || 0 } : { rong: 2.8 }); }
function veGoc(g, q, i, on, mau, vach, o) { o = o || {}; return TG.goc(g, q, i, { mau: on ? mau : '#94A3B8', r: o.r || 30, kyHieu: on ? (vach || 1) : 1, doMoTo: on ? 0.35 : 0.1, nhan: on ? true : undefined, le: 0 }); }
var soL = KhungPhang.soL;
/* =====================================================================
   HÌNH CHỮ NHẬT — Toán 8
   A cố định; kéo B (xoay, đổi chiều dài) và D (đổi chiều rộng); luôn có 4 góc vuông.
   ===================================================================== */
function phap(P) { var u = H.tru(P.B, P.A), L = Math.hypot(u[0], u[1]) || 1; return [-u[1] / L, u[0] / L]; }
function dinh(P) { var A = P.A, B = P.B, D = P.D; return { A: A, B: B, C: [B[0] + D[0] - A[0], B[1] + D[1] - A[1]], D: D }; }

KhungPhang.tao({
  ten: 'Hình chữ nhật',
  lop: 8,
  diem: { A: [-3, -1.5], B: [3, -1.5], D: [-3, 2] },
  coDinh: ['A'],
  buocLuoi: 0.5,
  rangBuoc: {
    B: function (p, P) { return H.dai(p, P.A) < 1 ? null : p; },
    D: function (p, P) { var n = phap(P), k = Math.max(0.8, (p[0] - P.A[0]) * n[0] + (p[1] - P.A[1]) * n[1]); return H.cong(P.A, H.nhan(n, k)); },
  },
  sauKeo: function (ten, P) { if (ten === 'B') P.D = H.cong(P.A, H.nhan(phap(P), H.dai(P.A, P.D))); },
  batDau: ['goc'],

  lamSang: [
    { id: 'goc', nhan: 'Bốn góc vuông', mau: '#16A34A', ghiChu: 'Hình chữ nhật là tứ giác có <b>bốn góc vuông</b>. Hình chữ nhật cũng là một hình bình hành, một hình thang cân.' },
    { id: 'canhDoi', nhan: 'Các cạnh đối', mau: M1, ghiChu: 'Như mọi hình bình hành, hình chữ nhật có <b>các cạnh đối song song và bằng nhau</b>.' },
    { id: 'cheo', nhan: 'Hai đường chéo', mau: M.duongCheo, ghiChu: function (P) { var q = dinh(P); return 'Trong hình chữ nhật, <b>hai đường chéo bằng nhau và cắt nhau tại trung điểm mỗi đường</b>: $OA = OB = OC = OD \\approx ' + soL(H.dai(q.A, q.C) / 2) + '$ cm.'; } },
    { id: 'tv', nhan: 'Áp dụng vào tam giác vuông', mau: '#D97706', ghiChu: function (P) { var q = dinh(P); return 'Tam giác $ABD$ vuông tại $A$ có $AO$ là trung tuyến ứng với cạnh huyền $BD$: <b>$AO = \\dfrac{BD}{2}$</b> $\\approx ' + soL(H.dai(q.B, q.D) / 2) + '$ cm.'; } },
  ],

  ve: function (g, P) {
    var q = dinh(P), O = H.trung(q.A, q.C);
    g.daGiac([q.A, q.B, q.C, q.D], { to: '#93C5FD', doMoTo: 0.22, rong: 0 });
    if (g.bat('tv')) {
      g.daGiac([q.A, q.B, q.D], { to: '#FDE68A', doMoTo: 0.5, rong: 0 });
      g.doan(q.B, q.D, { mau: '#D97706', rong: 4 }); g.doan(q.A, O, { mau: '#D97706', rong: 4, kyHieu: 1 });
      g.kyHieu(q.B, O, 1, '#D97706'); g.kyHieu(O, q.D, 1, '#D97706'); g.diem(O, 'O', { r: 3.5, mau: '#D97706', huong: [0.7, -1] });
    }
    if (g.bat('cheo')) TG.cheo(g, q, { sang: 'cheo', bang: true });
    var oc = g.bat('canhDoi');
    veCanh(g, q.A, q.B, oc, M1, 1); veCanh(g, q.D, q.C, oc, M1, 1); veCanh(g, q.A, q.D, oc, M2, 2); veCanh(g, q.B, q.C, oc, M2, 2);
    var ov = g.bat('goc');
    [0, 1, 2, 3].forEach(function (i) { TG.goc(g, q, i, { mau: ov ? '#16A34A' : '#475569', r: ov ? 22 : 16, doMoTo: ov ? 0.4 : 0.1 }); });
    if (g.hienSo()) { g.nhanDo(q.A, q.B, so(H.dai(q.A, q.B)), { benTrai: false }); g.nhanDo(q.D, q.A, so(H.dai(q.A, q.D)), {}); }
    TG.nhanDinh(g, q);
  },

  nhanXet: function (P) {
    var q = dinh(P), r = 'Hình chữ nhật $ABCD$: $AC = BD \\approx ' + soL(H.dai(q.A, q.C)) + '$';
    if (H.bang(H.dai(q.A, q.B), H.dai(q.A, q.D))) r += '<br><span class="dung">Hai cạnh kề bằng nhau → hình vuông!</span>';
    return r + TG.dauHieu('Dấu hiệu nhận biết hình chữ nhật', ['Tứ giác có <b>ba góc vuông</b>.', 'Hình thang cân có <b>một góc vuông</b>.', 'Hình bình hành có <b>một góc vuông</b>.', 'Hình bình hành có <b>hai đường chéo bằng nhau</b>.']);
  },
  congThuc: function (P, ts, C) { var a = H.dai(P.A, P.B), b = H.dai(P.A, P.D); return [{ id: 'cheo', ten: 'Tính chất', bt: '${' + C.m('goc', '\\widehat{A} = \\widehat{B} = \\widehat{C} = \\widehat{D} = 90^\\circ') + '}$ ; ${' + C.m('cheo', 'AC = BD') + '}$' }, { id: null, ten: 'Chu vi, diện tích', bt: '$C = 2(' + soL(a) + ' + ' + soL(b) + ') = ' + soL(2 * (a + b)) + '$ cm ; $S = ' + soL(a) + '\\cdot ' + soL(b) + ' = ' + soL(a * b) + '$ cm²' }]; },
  khungNhin: function (P) { return [dinh(P).C]; },
});
</script>
</body>
</html>
