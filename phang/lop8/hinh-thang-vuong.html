<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hình thang vuông</title>
<link rel="stylesheet" href="../../chung/giao-dien.css">
<link rel="stylesheet" href="../../chung/khung-3d.css">
<link rel="stylesheet" href="../../chung/khung-phang.css">
<script src="../../chung/cau-hinh.js"></script>
<script src="../../chung/dang-nhap.js" data-goc="../../"></script>
</head>
<body>
<div id="thanh-tren"></div>
<div id="mo-hinh"></div>

<script src="../../chung/thanh-chia.js"></script>
<script src="../../chung/khung-phang.js"></script>
<script>
var H = KhungPhang.H, so = KhungPhang.so, M = KhungPhang.MAU, TG = KhungPhang.tuGiac, DX = KhungPhang.doiXung;
var M1 = '#E0342F', M2 = '#1E6FE0', MG1 = '#F59E0B', MG2 = '#7C3AED', MCAO = '#92400E';
function veCanh(g, P1, P2, on, mau, vach) { g.doan(P1, P2, on ? { mau: mau, rong: 5, kyHieu: vach || 0 } : { rong: 2.8 }); }
function veGoc(g, q, i, on, mau, vach, o) { o = o || {}; return TG.goc(g, q, i, { mau: on ? mau : '#94A3B8', r: o.r || 30, kyHieu: on ? (vach || 1) : 1, doMoTo: on ? 0.35 : 0.1, nhan: on ? true : undefined, le: 0 }); }
var soL = KhungPhang.soL;
/* =====================================================================
   HÌNH THANG VUÔNG — Toán 8
   AB // CD, AD ⊥ AB. A cố định; kéo B (ngang), D (dọc), C (ngang).
   ===================================================================== */
function dinh(P) { return { A: P.A, B: P.B, C: [P.C[0], P.D[1]], D: P.D }; }

/* ---------- Vẽ hình bằng dụng cụ (dùng chung) ---------- */
var D = KhungPhang.dung, MAU_GOC_VE = '#16A34A', TIA = { rong: 2, mau: '#475569' };
function donVi(v) { var L = Math.hypot(v[0], v[1]) || 1; return [v[0] / L, v[1] / L]; }
function tenVe(g, q, chi, tam) {
  tam = tam || H.nhan(H.cong(H.cong(q.A, q.B), H.cong(q.C, q.D)), 0.25);
  chi.split('').forEach(function (k) { g.diem(q[k], k, { huong: donVi(H.tru(q[k], tam)) }); });
}
function tenTia(g, X, ten, P) { var u = donVi(H.tru(X, P)); g.chu(H.cong(X, H.nhan(u, 0.35)), ten, { mau: '#475569', nghieng: true }); }
function muiTenDay(g, m, u) { g.duong([H.cong(m, H.cong(H.nhan(u, -0.15), [-u[1] * 0.15, u[0] * 0.15])), H.cong(m, H.nhan(u, 0.1)), H.cong(m, H.cong(H.nhan(u, -0.15), [u[1] * 0.15, -u[0] * 0.15]))], { mau: M1, rong: 2.5 }); }
function nutVe(nhan) {
  return { id: 've', nhan: nhan, anDiem: true, vuaKhung: khungVe,
    thoiGian: function (P) { return kbVe(P).tong * 1000; }, ghiChu: function (P, ts, t) { return kbVe(P).ghi(t); } };
}
function kbVe(P) {
  var q = dinh(P), A = q.A, B = q.B, C = q.C, Dd = q.D, a = H.dai(A, B), b = H.dai(Dd, C), h = H.dai(A, Dd), n = 0, L = Math.max(a * 0.6, h) + 1;
  var u = donVi(H.tru(B, A)), nn = donVi(H.tru(Dd, A)), Y = H.cong(A, H.nhan(nn, h + 1.2)), X = H.cong(Dd, H.nhan(u, b + 1.4)), dat;
  function Bc(t) { n++; return '<b>Bước ' + n + '.</b> ' + t; }
  return KhungPhang.kichBan([
    D.doanChia(A, B, { ghi: Bc('Dùng thước thẳng có vạch chia vẽ đáy $AB = ' + soL(a) + '$ cm.'), sau: function (g) { tenVe(g, q, 'AB'); } }),
    D.datEke(A, H.huong(A, B), 1, { loai: 'vuong', dai: L, ghi: Bc('Đặt ê ke sao cho đỉnh góc vuông trùng với $A$, một cạnh góc vuông nằm trên $AB$.') }),
    D.keTheoEke(A, H.huong(A, B), 1, Y, { loai: 'vuong', dai: L, net: TIA, ghi: 'Kẻ tia $Ay$ theo cạnh góc vuông còn lại: $Ay \\perp AB$.',
      sau: function (g) { tenTia(g, Y, 'y', A); g.goc(B, A, Y, { mau: MAU_GOC_VE, r: 16, nhan: false }); } }),
    D.doDoan(A, Dd, { ben: -1, ghi: Bc('Trên tia $Ay$ dùng thước đánh dấu điểm $D$ sao cho $AD = ' + soL(h) + '$ cm (đường cao).'), sau: function (g) { tenVe(g, q, 'D'); } }),
    (dat = D.datThuocHaiLe(A, B, Dd, Dd, X, { ghi: Bc('Qua $D$ kẻ đường thẳng song song với $AB$: đặt một lề của thước thẳng hai lề trùng với $AB$ rồi trượt song song tới khi lề thước đi qua $D$.') })),
    D.keTheoThuocHaiLe(dat, Dd, X, { net: TIA, ghi: 'Kẻ tia $Dx$ theo lề thước: $Dx \\parallel AB$.', sau: function (g) { tenTia(g, X, 'x', Dd); } }),
    D.doDoan(Dd, C, { ben: 1, ghi: Bc('Trên tia $Dx$ dùng thước đánh dấu điểm $C$ sao cho $DC = ' + soL(b) + '$ cm.'), sau: function (g) { tenVe(g, q, 'C'); } }),
    D.doan(B, C, { ghi: Bc('Dùng thước thẳng nối $B$ với $C$.') }),
    D.hien(function (g) {
      g.daGiac([A, B, C, Dd], { to: '#93C5FD', doMoTo: 0.35, rong: 0 });
      g.doan(A, B, { mau: M1, rong: 3.5 }); g.doan(Dd, C, { mau: M1, rong: 3.5 }); g.doan(A, Dd, { mau: MCAO, rong: 3.5 }); g.doan(B, C, { rong: 3 });
      muiTenDay(g, H.trung(A, B), u); muiTenDay(g, H.trung(Dd, C), u);
      TG.goc(g, q, 0, { mau: MAU_GOC_VE, r: 16, doMoTo: 0.3 }); TG.goc(g, q, 3, { mau: MAU_GOC_VE, r: 16, doMoTo: 0.3 });
      tenVe(g, q, 'ABCD');
    }, { tg: 1.3, ghi: 'Ta được <b>hình thang vuông $ABCD$</b>: $AB \\parallel CD$, $\\widehat{A} = \\widehat{D} = 90^\\circ$, cạnh bên $AD$ là đường cao.' }),
  ]);
}
function khungVe(P) {
  var q = dinh(P), u = donVi(H.tru(q.B, q.A)), nn = donVi(H.tru(q.D, q.A)), a = H.dai(q.A, q.B), h = H.dai(q.A, q.D), b = H.dai(q.D, q.C), L = Math.max(a * 0.6, h) + 1;
  return [q.A, q.B, q.C, q.D, H.cong(q.A, H.nhan(nn, h + 1.6)), H.cong(q.A, H.nhan(u, L)), H.cong(q.A, H.nhan(nn, L)), H.cong(q.D, H.nhan(u, b + 1.8)), H.cong(H.cong(q.D, H.nhan(u, b + 1.8)), H.nhan(nn, 1.6)), H.tru(q.A, H.nhan(nn, 1.8))];
}

KhungPhang.tao({
  ten: 'Hình thang vuông',
  lop: 8,
  diem: { A: [-3, 0], B: [4, 0], C: [1, 3], D: [-3, 3] },
  nhapGoc: [
    { id: 'B', ten: '\\widehat{B}', min: 5, max: 175, lay: function (P) { var q = dinh(P); return H.gocDo(q.A, q.B, q.C); },
      dat: function (P, ts, d) { var h = P.D[1] - P.B[1], C2 = KhungPhang.goc.quay(P.B, P.A, [P.B[0], P.D[1]], d, h / Math.sin(d * Math.PI / 180)); if (C2[0] < P.D[0] + 0.5) return false; P.C = [C2[0], P.D[1]]; } },
    { id: 'C', ten: '\\widehat{C}', min: 5, max: 175, lamTron: false, lay: function (P) { var q = dinh(P); return H.gocDo(q.B, q.C, q.D); },
      dat: function (P, ts, d) { var h = P.D[1] - P.B[1], b = 180 - d, C2 = KhungPhang.goc.quay(P.B, P.A, [P.B[0], P.D[1]], b, h / Math.sin(b * Math.PI / 180)); if (C2[0] < P.D[0] + 0.5) return false; P.C = [C2[0], P.D[1]]; } },
  ],
  coDinh: ['A'],
  buocLuoi: 0.5,
  rangBuoc: {
    B: function (p, P) { return [Math.max(P.A[0] + 1, p[0]), P.A[1]]; },
    D: function (p, P) { return [P.A[0], Math.max(P.A[1] + 0.5, p[1])]; },
    C: function (p, P) { return [Math.max(P.D[0] + 0.5, p[0]), P.D[1]]; },
  },
  sauKeo: function (ten, P) { if (ten === 'D') P.C = [P.C[0], P.D[1]]; },
  batDau: ['vuong'],
  hoatHinh: [nutVe('Vẽ bằng thước thẳng và ê ke')],

  lamSang: [
    { id: 'day', nhan: 'Hai đáy AB // CD', mau: M1, ghiChu: 'Hình thang vuông vẫn là hình thang: ${AB \\parallel CD}$.' },
    { id: 'vuong', nhan: 'Hai góc vuông A, D', mau: '#16A34A', ghiChu: 'Hình thang vuông là hình thang có <b>một góc vuông</b>. Khi đó góc kề cạnh bên còn lại cũng vuông: $\\widehat{A} = \\widehat{D} = 90^\\circ$.' },
    { id: 'cao', nhan: 'AD là đường cao', mau: MCAO, ghiChu: function (P) { return 'Cạnh bên $AD$ vuông góc với hai đáy nên $AD$ cũng là <b>đường cao</b>: $h = AD = ' + soL(P.D[1] - P.A[1]) + '$ cm.'; } },
    { id: 'goc', nhan: 'B̂ + Ĉ = 180°', mau: MG2, ghiChu: function (P) { var q = dinh(P); return 'Hai góc kề cạnh bên $BC$ bù nhau: $\\widehat{B} + \\widehat{C} = ' + soL(H.gocDo(q.A, q.B, q.C), 0) + '^\\circ + ' + soL(H.gocDo(q.B, q.C, q.D), 0) + '^\\circ = 180^\\circ$.'; } },
  ],

  ve: function (g, P) {
    var q = dinh(P), tv = g.hoat('ve');
    if (tv !== null) { kbVe(P).ve(g, tv); return; }
    g.daGiac([q.A, q.B, q.C, q.D], { to: '#93C5FD', doMoTo: 0.22, rong: 0 });
    veCanh(g, q.A, q.B, g.bat('day'), M1); veCanh(g, q.D, q.C, g.bat('day'), M1);
    if (g.bat('cao')) { g.doan(q.A, q.D, { sang: 'cao' }); g.nhanDo(q.A, q.D, 'h = ' + so(q.D[1] - q.A[1]), { mau: MCAO, kc: 28 }); } else veCanh(g, q.A, q.D, false);
    veCanh(g, q.B, q.C, false);
    var ov = g.bat('vuong');
    TG.goc(g, q, 0, { mau: ov ? '#16A34A' : '#475569', r: ov ? 22 : 16, doMoTo: ov ? 0.4 : 0.1 });
    TG.goc(g, q, 3, { mau: ov ? '#16A34A' : '#475569', r: ov ? 22 : 16, doMoTo: ov ? 0.4 : 0.1 });
    var og = g.bat('goc'); veGoc(g, q, 1, og, MG2, 1); veGoc(g, q, 2, og, MG1, 2);
    TG.nhanDinh(g, q);
  },

  nhanXet: function (P) {
    return 'Hình thang vuông $ABCD$: ${AB \\parallel CD}$, $\\widehat{A} = \\widehat{D} = 90^\\circ$' + TG.dauHieu('Dấu hiệu nhận biết', ['Hình thang có <b>một góc vuông</b> là hình thang vuông.']);
  },
  congThuc: function (P, ts, C) { var q = dinh(P), a = H.dai(q.A, q.B), b = H.dai(q.D, q.C), h = q.D[1] - q.A[1]; return [{ id: 'cao', ten: 'Diện tích', bt: '$S = \\dfrac{(AB + CD)\\cdot ' + C.m('cao', 'AD') + '}{2} = \\mathbf{' + soL((a + b) * h / 2) + '}$ (cm²)' }]; },
});
</script>
</body>
</html>
