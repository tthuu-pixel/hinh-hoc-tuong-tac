<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tỉ số lượng giác của góc nhọn</title>
<link rel="stylesheet" href="../../chung/giao-dien.css">
<link rel="stylesheet" href="../../chung/khung-3d.css">
<link rel="stylesheet" href="../../chung/khung-phang.css">
<script src="../../chung/cau-hinh.js"></script>
<script src="../../chung/dang-nhap.js" data-goc="../../"></script>
</head>
<body>
<div id="thanh-tren"></div>
<div id="mo-hinh"></div>

<script src="../../chung/khung-phang.js"></script>
<script>
var H = KhungPhang.H, so = KhungPhang.so, M = KhungPhang.MAU, DX = KhungPhang.doiXung;
var O0 = [0, 0];
function diemDT(O, R, a) { return [O[0] + R * Math.cos(a), O[1] + R * Math.sin(a)]; }
function veCung(g, O, R, a0, a1, o) { var n = Math.max(8, Math.ceil(Math.abs(a1 - a0) * 40)), ds = []; for (var i = 0; i <= n; i++) ds.push(diemDT(O, R, a0 + (a1 - a0) * i / n)); g.duong(ds, o || {}); return ds; }
function lenDT(O, R) { return function (p) { var d = H.dai(p, O); if (d < 1e-6) return null; return [O[0] + (p[0] - O[0]) * R / d, O[1] + (p[1] - O[1]) * R / d]; }; }
function gocCua(p, O) { var a = Math.atan2(p[1] - (O || O0)[1], p[0] - (O || O0)[0]); return a < 0 ? a + 2 * Math.PI : a; }
function ccw(a0, a1) { var d = a1 - a0; while (d < 0) d += 2 * Math.PI; while (d >= 2 * Math.PI) d -= 2 * Math.PI; return d; }   // góc quay ngược chiều từ a0 đến a1
var GACH = '<hr style="border:none;border-top:1px dashed #CBD5E1;margin:8px 0">';
var soL = KhungPhang.soL;
/* =====================================================================
   TỈ SỐ LƯỢNG GIÁC CỦA GÓC NHỌN — Toán 9
   Tam giác ABC vuông tại A, góc nhọn α = góc B. Kéo A (ngang), C (dọc).
   ===================================================================== */
var MD = '#E0342F', MK = '#1E6FE0', MH = '#B45309';
var MS = { sin: '#16A34A', cos: '#0891B2', tan: '#7C3AED', cot: '#DB2777' };
function tg(P) { var B = [0, 0], A = P.A, C = [P.A[0], P.C[1]]; return { A: A, B: B, C: C, ke: A[0], doi: C[1], huyen: Math.hypot(A[0], C[1]), goc: Math.atan2(C[1], A[0]) * 180 / Math.PI }; }
var TS = {
  sin: { t: 'đối', m: 'huyền', f: function (q) { return q.doi / q.huyen; }, a: 'AC', b: 'BC' },
  cos: { t: 'kề', m: 'huyền', f: function (q) { return q.ke / q.huyen; }, a: 'AB', b: 'BC' },
  tan: { t: 'đối', m: 'kề', f: function (q) { return q.doi / q.ke; }, a: 'AC', b: 'AB' },
  cot: { t: 'kề', m: 'đối', f: function (q) { return q.ke / q.doi; }, a: 'AB', b: 'AC' },
};
function ghiTS(k) { return function (P) { var q = tg(P), x = TS[k]; return '$\\' + k + '\\alpha = \\dfrac{\\text{cạnh ' + x.t + '}}{\\text{cạnh ' + x.m + '}} = \\dfrac{' + x.a + '}{' + x.b + '} = \\dfrac{' + soL(doDai(q, x.a)) + '}{' + soL(doDai(q, x.b)) + '} \\approx ' + soL(x.f(q), 3) + '$'; }; }
function datGoc(d) { return function (P, ts, api) { P.A = [4, 0]; P.C = [4, 4 * Math.tan(d * Math.PI / 180)]; api.vuaKhung(); }; }

var TEN_CANH = { AC: 'đối', AB: 'kề', BC: 'huyền' }, MAU_CANH = { AC: MD, AB: MK, BC: MH };
function tsMoiNhat(g) {   // tỉ số được bật gần nhất
  var chon = null, it = Infinity;
  ['sin', 'cos', 'tan', 'cot'].forEach(function (k) { var t = g.tg(k); if (t !== null && t < it) { it = t; chon = k; } });
  return chon;
}
function goc0(q) { return { AC: [q.A, q.C], AB: [q.B, q.A], BC: [q.B, q.C] }; }
function doDai(q, k) { return k === 'AC' ? q.doi : k === 'AB' ? q.ke : q.huyen; }
function chuTo(g, p, text, mau, co, canh) {
  g.raw('<text x="' + g.X(p).toFixed(1) + '" y="' + (g.Y(p) + co * 0.35).toFixed(1) + '" text-anchor="' + (canh || 'middle') + '" font-size="' + co + '" font-weight="700" fill="' + mau + '" font-family="inherit">' + text + '</text>');
}
// Hai cạnh tham gia tỉ số "bay" ra thành tử số và mẫu số của phân số bên phải tam giác
function veBangTiSo(g, q, k, t) {
  var x = TS[k], tu = x.a, mau = x.b, G = goc0(q), s = 1 / g.tiLe();
  var X0 = q.A[0] + 2.0, Y0 = Math.max(q.C[1] * 0.55, 1.4);
  var ti = Math.min(1, 3 / q.huyen), Lt = doDai(q, tu) * ti, Lm = doDai(q, mau) * ti, Lb = Math.max(Lt, Lm) + 0.6;
  var bx = X0 + 2.3, gy = 0.55;
  var dichTu = [[bx + (Lb - Lt) / 2, Y0 + gy], [bx + (Lb + Lt) / 2, Y0 + gy]];
  var dichMau = [[bx + (Lb - Lm) / 2, Y0 - gy], [bx + (Lb + Lm) / 2, Y0 - gy]];
  var e = H.em(H.doan(t, 0.15, 1.3));
  // khung nền
  g.daGiac([[X0 - 0.3, Y0 - 1.55], [bx + Lb + 3.4, Y0 - 1.55], [bx + Lb + 3.4, Y0 + 1.55], [X0 - 0.3, Y0 + 1.55]], { to: '#FFFFFF', doMoTo: 0.92 * Math.min(1, t / 0.3), mauNet: MS[k], rong: 2.5 });
  g.latex([X0 + 1.05, Y0], '\\' + k + '\\alpha =', { mau: MS[k], co: 26 });
  g.doan([bx, Y0], [bx + Lb, Y0], { mau: '#1B2540', rong: 3, doMo: Math.min(1, t / 0.4) });
  [[tu, dichTu], [mau, dichMau]].forEach(function (c) {
    var goc = G[c[0]], P1 = H.lerp(goc[0], c[1][0], e), P2 = H.lerp(goc[1], c[1][1], e);
    g.doan(P1, P2, { mau: MAU_CANH[c[0]], rong: 7 });
  });
  if (e >= 1) {
    var kc = 0.42;
    g.latex([bx + Lb / 2, Y0 + gy + kc], c2(tu) + ' = ' + soL(doDai(q, tu)), { mau: MAU_CANH[tu], co: 20 });
    g.latex([bx + Lb / 2, Y0 - gy - kc - 0.1], c2(mau) + ' = ' + soL(doDai(q, mau)), { mau: MAU_CANH[mau], co: 20 });
    if (t > 1.6) g.latex([bx + Lb + 0.25, Y0], '\\approx ' + soL(x.f(q), 3), { mau: MS[k], co: 28, canh: 'start' });
  }
  function c2(c) { return '\\text{' + TEN_CANH[c] + '}\\ ' + c; }
}

KhungPhang.tao({
  ten: 'Tỉ số lượng giác của góc nhọn',
  lop: 9,
  diem: { A: [4, 0], C: [4, 3] },
  buocLuoi: 0.5,
  rangBuoc: {
    A: function (p) { return [Math.max(1, p[0]), 0]; },
    C: function (p, P) { return [P.A[0], Math.max(0.5, p[1])]; },
  },
  sauKeo: function (ten, P) { if (ten === 'A') P.C = [P.A[0], P.C[1]]; },
  tieuDeNutPhu: 'Góc đặc biệt',
  nutPhu: [{ nhan: 'α = 30°', bam: datGoc(30) }, { nhan: 'α = 45°', bam: datGoc(45) }, { nhan: 'α = 60°', bam: datGoc(60) }],
  batDau: ['doi', 'ke', 'huyen'],

  lamSang: [
    { id: 'doi', nhan: 'Cạnh đối', mau: MD, ghiChu: 'Đối với góc $\\alpha = \\widehat{B}$: cạnh <b>đối</b> là $AC$ (nằm đối diện góc $\\alpha$).' },
    { id: 'ke', nhan: 'Cạnh kề', mau: MK, ghiChu: 'Cạnh góc vuông <b>kề</b> với góc $\\alpha$ là $AB$.' },
    { id: 'huyen', nhan: 'Cạnh huyền', mau: MH, ghiChu: 'Cạnh <b>huyền</b> $BC$ đối diện góc vuông.' },
    { id: 'sin', nhan: 'sin α', mau: MS.sin, vuaKhung: true, lap: true, ghiChu: ghiTS('sin') },
    { id: 'cos', nhan: 'cos α', mau: MS.cos, vuaKhung: true, lap: true, ghiChu: ghiTS('cos') },
    { id: 'tan', nhan: 'tan α', mau: MS.tan, vuaKhung: true, lap: true, ghiChu: ghiTS('tan') },
    { id: 'cot', nhan: 'cot α', mau: MS.cot, vuaKhung: true, lap: true, ghiChu: ghiTS('cot') },
    { id: 'phu', nhan: 'Hai góc phụ nhau', mau: '#D97706',
      ghiChu: function (P) { var q = tg(P); return '$\\widehat{B} + \\widehat{C} = 90^\\circ$ (hai góc phụ nhau). Cạnh đối của góc $B$ là cạnh kề của góc $C$, nên: $\\sin B = \\cos C \\approx ' + soL(q.doi / q.huyen, 3) + '$; $\\cos B = \\sin C$; $\\tan B = \\cot C$; $\\cot B = \\tan C$.'; } },
  ],
  hoatHinh: [
    { id: 'phong', nhan: 'Phóng to, thu nhỏ tam giác', thoiGian: 7000,
      vuaKhung: function (P) { var q = tg(P); return [[0, 0], [q.ke * 1.8, q.doi * 1.8]]; },
      ghiChu: function (P, ts, t) { var q = tg(P); return 'Giữ nguyên góc $\\alpha \\approx ' + soL(q.goc, 1) + '^\\circ$, thay đổi kích thước tam giác: các cạnh thay đổi nhưng $\\sin\\alpha \\approx ' + soL(q.doi / q.huyen, 3) + '$ không đổi. Tỉ số lượng giác <b>chỉ phụ thuộc vào góc</b>.'; } },
  ],

  ve: function (g, P) {
    var q = tg(P), A = q.A, B = q.B, C = q.C, tp = g.hoat('phong');
    var k = tp === null ? 1 : 1 + 0.8 * Math.sin(2 * Math.PI * tp) * (tp < 0.5 ? 1 : 0.6);
    if (tp !== null) {
      var A2 = H.nhan(A, k), C2 = H.nhan(C, k);
      g.daGiac([A, B, C], { to: '#E2E8F0', doMoTo: 0.4, rong: 1.5, dut: '5 4' });
      g.daGiac([A2, B, C2], { to: '#93C5FD', doMoTo: 0.3, rong: 0 });
      g.doan(A2, C2, { mau: MD, rong: 4 }); g.doan(B, C2, { mau: MH, rong: 4 }); g.doan(B, A2, { mau: MK, rong: 3 });
      g.nhanDo(A2, C2, so(q.doi * k), { mau: MD }); g.nhanDo(C2, B, so(q.huyen * k), { mau: MH });
      g.goc(A2, B, C2, { mau: '#D97706', r: 40, doMoTo: 0.25, nhan: 'α', xaNhan: 12 });
      g.goc(B, A2, C2, { r: 14 });
      g.latex(H.cong(H.trung(B, C2), [-1.4, 1.1]), '\\sin\\alpha = \\dfrac{' + soL(q.doi * k) + '}{' + soL(q.huyen * k) + '} \\approx ' + soL(q.doi / q.huyen, 3), { mau: MS.sin, co: 22 });
      return;
    }
    // Vai trò các cạnh
    var bat = function (id) { return g.bat(id); };
    var dung = function (canh) { return ['sin', 'cos', 'tan', 'cot'].some(function (k) { return bat(k) && (TS[k].a === canh || TS[k].b === canh); }); };
    g.daGiac([A, B, C], { to: '#93C5FD', doMoTo: 0.22, rong: 0 });
    var oDoi = bat('doi') || dung('AC'), oKe = bat('ke') || dung('AB'), oHuyen = bat('huyen') || dung('BC');
    var ts0 = tsMoiNhat(g), tt0 = ts0 ? g.tg(ts0) : null, dap = tt0 !== null && tt0 < 3.2 ? 3.5 * (0.5 + 0.5 * Math.sin(tt0 * Math.PI * 2 * 1.3)) : 0;
    var doan3 = { AC: [A, C, MD, oDoi], AB: [B, A, MK, oKe], BC: [B, C, MH, oHuyen] };
    Object.keys(doan3).forEach(function (k) {
      var d = doan3[k], nhan = ts0 && (TS[ts0].a === k || TS[ts0].b === k);
      g.doan(d[0], d[1], d[3] ? { mau: d[2], rong: 5 + (nhan ? dap : 0) } : { rong: 2.8 });
    });
    if (ts0) veBangTiSo(g, q, ts0, tt0);
    if (oDoi) g.chu(H.cong(H.trung(A, C), [1.15, -0.35]), 'đối', { mau: MD });
    if (oKe) g.chu(H.cong(H.trung(A, B), [0, -0.55]), 'kề', { mau: MK });
    if (oHuyen) g.chu(H.cong(H.trung(B, C), [-0.45, 0.45]), 'huyền', { mau: MH });
    g.goc(A, B, C, { mau: '#D97706', r: 44, doMoTo: 0.25, nhan: 'α = ' + so(q.goc, 1) + '°', xaNhan: 14 });
    g.goc(B, A, C, { r: 14 });
    if (bat('phu')) g.goc(B, C, A, { mau: '#D97706', r: 36, kyHieu: 2, doMoTo: 0.25, nhan: so(90 - q.goc, 1) + '°' });
    if (g.hienSo()) { g.nhanDo(A, C, so(q.doi), { mau: MD, benTrai: false }); g.nhanDo(B, A, so(q.ke), { mau: MK }); g.nhanDo(C, B, so(q.huyen), { mau: MH }); }
    g.diem(A, 'A', { huong: [1, -1] }); g.diem(B, 'B', { huong: [-1, -1] }); g.diem(C, 'C', { huong: [1, 1] });
  },

  congThuc: function (P, ts, C) {
    var q = tg(P);
    function dong(k, tu, mau, v) { return { id: k, ten: k + ' α', bt: '$' + C.m(k, '\\' + k + '\\alpha') + ' = \\dfrac{\\text{' + TS[k].t + '}}{\\text{' + TS[k].m + '}} = \\dfrac{' + tu + '}{' + mau + '} \\approx ' + soL(v, 3) + '$' }; }
    return [dong('sin', 'AC', 'BC', q.doi / q.huyen), dong('cos', 'AB', 'BC', q.ke / q.huyen), dong('tan', 'AC', 'AB', q.doi / q.ke), dong('cot', 'AB', 'AC', q.ke / q.doi)];
  },
  nhanXet: function (P) {
    var q = tg(P);
    return '$\\alpha = \\widehat{B} \\approx ' + soL(q.goc, 1) + '^\\circ$<br>$0 < \\sin\\alpha < 1$; $0 < \\cos\\alpha < 1$; $\\tan\\alpha \\cdot \\cot\\alpha = 1$' + GACH + '<i>Mẹo nhớ:</i> “Sin đi học (đối/huyền), Cos không hư (kề/huyền), Tan đoàn kết (đối/kề), Cot kết đoàn (kề/đối)”.';
  },
  khungNhin: function (P, ts, bat) {
    var q = tg(P), ds = [[-0.8, -0.8], H.cong(q.C, [1.2, 0.8])];
    if (['sin', 'cos', 'tan', 'cot'].some(function (k) { return bat(k); })) { var L = Math.min(q.huyen, 3) + 0.6; ds.push([q.A[0] + 2.0 + 2.3 + L + 3.6, Math.max(q.C[1] * 0.55, 1.4) + 1.8], [q.A[0], Math.max(q.C[1] * 0.55, 1.4) - 1.8]); }
    return ds;
  },
});
</script>
</body>
</html>
