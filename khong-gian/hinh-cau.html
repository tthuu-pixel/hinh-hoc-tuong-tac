<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hình cầu</title>
<link rel="stylesheet" href="../chung/giao-dien.css">
<link rel="stylesheet" href="../chung/khung-3d.css">
<script src="../chung/cau-hinh.js"></script>
<script src="../chung/dang-nhap.js" data-goc="../"></script>
</head>
<body>
<div id="thanh-tren"></div>
<div id="mo-hinh"></div>

<script src="../thu-vien-ngoai/three-bundle.min.js"></script>
<script src="../chung/khung-3d.js"></script>
<script>
/* =====================================================================
   HÌNH CẦU  — Toán 9
   Tâm O, bán kính R; A, B là hai đầu một đường kính trên đường tròn lớn
   ===================================================================== */
var M = KhongGian.MAU, so = KhongGian.so, PI = Math.PI;
function soL(x, l) { return so(x, l).replace(',', '{,}'); }
var GOC_A = PI / 12, MAU_TRU = '#64748B';

KhongGian.tao({
  ten: 'Hình cầu',
  lop: 9,
  donVi: 'cm',

  thamSo: [
    { khoa: 'R', nhan: 'Bán kính R', min: 1, max: 5, buoc: 0.5, gt: 3, donVi: 'cm', mau: M.banKinh },
  ],

  matCong: function (ts) {
    var R = ts.R, m = KhongGian.hinh.cau(R), x = R * Math.cos(GOC_A), z = R * Math.sin(GOC_A);
    m.dinh = { O: [0, R, 0], A: [x, R, z], B: [-x, R, -z] };
    m.huongNhan = { O: [-0.5, 0.8, 0.3], A: [0.5, -0.3, 1], B: [-0.6, 0.3, -1] };
    m.banKinh = R * 1.3;   // chừa chỗ cho hình trụ ngoại tiếp khi bật
    return m;
  },

  lamSang: [
    {
      id: 'r', nhan: 'Bán kính R', mau: M.banKinh, doan: [['O', 'A']],
      nhanDo: function (ts) { return [{ doan: ['O', 'A'], chu: '<i>R</i> = ' + so(ts.R) + ' cm', huong: [0, 1, 0] }]; },
      ghiChu: function (ts) { return 'Mọi điểm trên mặt cầu cách tâm $O$ một khoảng bằng <b>bán kính</b> $R = ' + soL(ts.R) + '$ cm.'; },
    },
    {
      id: 'dk', nhan: 'Đường kính AB', mau: M.duongKinh, doan: [['A', 'B']],
      nhanDo: function (ts) { return [{ doan: ['A', 'B'], chu: 'AB = 2<i>R</i> = ' + so(2 * ts.R) + ' cm', huong: [0, -1, 0], t: 0.3 }]; },
      ghiChu: '$AB$ là một <b>đường kính</b>: đi qua tâm $O$, dài gấp đôi bán kính.',
    },
    {
      id: 'dtl', nhan: 'Đường tròn lớn', mau: M.matDay, canh: ['xichDao'],
      ghiChu: function (ts) { return '<b>Đường tròn lớn</b> là giao của mặt cầu với mặt phẳng đi qua tâm $O$, có bán kính bằng $R = ' + soL(ts.R) + '$ cm.'; },
    },
    {
      id: 'S', nhan: 'Diện tích mặt cầu', mau: M.xungQuanh, mat: ['matCau'],
      ghiChu: 'Diện tích mặt cầu bằng <b>4 lần</b> diện tích hình tròn lớn: $S = 4\\pi R^2$.',
    },
    {
      id: 'V', nhan: 'Thể tích', mau: M.theTich, khoi: true,
      ghiChu: 'Thể tích là phần không gian bên trong mặt cầu.',
    },
    {
      id: 'tru', nhan: 'Hình trụ ngoại tiếp', mau: MAU_TRU,
      hinhPhu: function (ts) { var t = KhongGian.hinh.tru(ts.R, 2 * ts.R); t.mat = t.mat.filter(function (m) { return m.ten === 'xungQuanh'; }); return [t]; },
      ghiChu: 'Hình trụ vừa khít hình cầu có bán kính $R$ và chiều cao $2R$. Thể tích hình cầu bằng <b>$\\dfrac{2}{3}$</b> thể tích hình trụ đó (phát hiện của Archimedes).',
    },
  ],

  congThuc: function (ts, C) {
    var R = ts.R, r = '{' + C.m('r', 'R') + '}', n = C.soL;
    return [
      { id: 'S', ten: 'Diện tích mặt cầu', bt: '$S = 4\\pi ' + r + '^2 = 4\\pi\\cdot ' + n(R) + '^2 \\approx \\mathbf{' + n(4 * PI * R * R) + '}$ (cm²)' },
      { id: 'V', ten: 'Thể tích', bt: '$V = \\dfrac{4}{3}\\pi ' + r + '^3 = \\dfrac{4}{3}\\cdot\\pi\\cdot ' + n(R) + '^3 \\approx \\mathbf{' + n(4 / 3 * PI * R * R * R) + '}$ (cm³)' },
      { id: 'tru', ten: 'So với hình trụ ngoại tiếp', bt: '$V_{\\text{trụ}} = \\pi ' + r + '^2\\cdot 2' + r + ' \\approx ' + n(2 * PI * R * R * R) + '$ $\\Rightarrow V_{\\text{cầu}} = \\dfrac{2}{3}V_{\\text{trụ}}$' },
    ];
  },

  matCat: [
    { id: 'ngang', nhan: 'Mặt phẳng nằm ngang', diemDacBiet: [0.5],
      matPhang: function (ts, t) { return { phapTuyen: [0, 1, 0], diem: [0, t * 2 * ts.R, 0] }; },
      thietDien: function (ts, t) {
        var R = ts.R, y = t * 2 * R, d = y - R, rr = Math.sqrt(Math.max(0, R * R - d * d));
        var quaTam = Math.abs(d) < 1e-6;
        return { diem: KhongGian.vongTron(y, rr, 96).slice(0, 96),
                 moTa: 'Mặt cắt là <b>hình tròn</b> bán kính ≈ ' + so(rr) + ' cm' +
                       (quaTam ? ' — mặt phẳng đi qua tâm <i>O</i> nên đây là <b>hình tròn lớn</b> (bán kính bằng <i>R</i>).' : ' (nhỏ hơn <i>R</i> vì mặt phẳng không qua tâm; khoảng cách từ <i>O</i> đến mặt phẳng là ' + so(Math.abs(d)) + ' cm).') +
                       '<br>Diện tích ≈ <b>' + so(PI * rr * rr) + ' cm²</b>' };
      } },
  ],
});
</script>
</body>
</html>
