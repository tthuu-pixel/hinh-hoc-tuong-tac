<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đường tròn ngoại tiếp, nội tiếp tam giác</title>
<link rel="stylesheet" href="../../chung/giao-dien.css">
<link rel="stylesheet" href="../../chung/khung-3d.css">
<link rel="stylesheet" href="../../chung/khung-phang.css">
<script src="../../chung/cau-hinh.js"></script>
<script src="../../chung/dang-nhap.js" data-goc="../../"></script>
</head>
<body>
<div id="thanh-tren"></div>
<div id="mo-hinh"></div>

<script src="../../chung/khung-phang.js"></script>
<script>
var H = KhungPhang.H, so = KhungPhang.so, M = KhungPhang.MAU, DX = KhungPhang.doiXung;
var O0 = [0, 0];
function diemDT(O, R, a) { return [O[0] + R * Math.cos(a), O[1] + R * Math.sin(a)]; }
function veCung(g, O, R, a0, a1, o) { var n = Math.max(8, Math.ceil(Math.abs(a1 - a0) * 40)), ds = []; for (var i = 0; i <= n; i++) ds.push(diemDT(O, R, a0 + (a1 - a0) * i / n)); g.duong(ds, o || {}); return ds; }
function lenDT(O, R) { return function (p) { var d = H.dai(p, O); if (d < 1e-6) return null; return [O[0] + (p[0] - O[0]) * R / d, O[1] + (p[1] - O[1]) * R / d]; }; }
function gocCua(p, O) { var a = Math.atan2(p[1] - (O || O0)[1], p[0] - (O || O0)[0]); return a < 0 ? a + 2 * Math.PI : a; }
function ccw(a0, a1) { var d = a1 - a0; while (d < 0) d += 2 * Math.PI; while (d >= 2 * Math.PI) d -= 2 * Math.PI; return d; }   // góc quay ngược chiều từ a0 đến a1
var GACH = '<hr style="border:none;border-top:1px dashed #CBD5E1;margin:8px 0">';
var soL = KhungPhang.soL;
/* =====================================================================
   ĐƯỜNG TRÒN NGOẠI TIẾP – NỘI TIẾP TAM GIÁC — Toán 9
   Kéo A, B, C. Chọn đường tròn ngoại tiếp (tâm O) hoặc nội tiếp (tâm I).
   ===================================================================== */
var MO = '#E0342F', MI = '#1E6FE0', MDT = '#7C3AED', MBK = '#D97706';
function chanPG(A, B, C) { var b = H.dai(A, C), c = H.dai(A, B); return H.lerp(B, C, c / (b + c)); }
function dat(A, B, C) { return function (P, ts, api) { P.A = A; P.B = B; P.C = C; api.vuaKhung(); }; }
function laNgoai(P, ts) { return ts.che === 'ngoai'; }
function laNoi(P, ts) { return ts.che === 'noi'; }
function loai(P) {
  var a = H.dai(P.B, P.C), b = H.dai(P.C, P.A), c = H.dai(P.A, P.B);
  if (H.bang(a, b) && H.bang(b, c)) return 'deu';
  var mx = Math.max(H.gocDo(P.B, P.A, P.C), H.gocDo(P.A, P.B, P.C), H.gocDo(P.A, P.C, P.B));
  return Math.abs(mx - 90) < 0.05 ? 'vuong' : mx > 90 ? 'tu' : 'nhon';
}

KhungPhang.tao({
  ten: 'Đường tròn ngoại tiếp, nội tiếp tam giác',
  lop: 9,
  diem: { A: [-1, 4], B: [-3.5, -1], C: [3.5, -1] },
  buocLuoi: 0.5,
  luaChon: [{ khoa: 'che', gt: 'ngoai', nhan: 'Đường tròn', vuaKhung: true, ds: [{ gt: 'ngoai', nhan: 'Ngoại tiếp' }, { gt: 'noi', nhan: 'Nội tiếp' }] }],
  tieuDeNutPhu: 'Tam giác đặc biệt',
  nutPhu: [
    { nhan: 'Tam giác nhọn', bam: dat([-1, 4], [-3.5, -1], [3.5, -1]) },
    { nhan: 'Tam giác vuông', bam: dat([-3, 3], [-3, -1], [3, -1]) },
    { nhan: 'Tam giác đều', bam: dat([0, -1 + 3 * Math.sqrt(3)], [-3, -1], [3, -1]) },
  ],
  batDau: ['dtN', 'dtI'],

  lamSang: [
    { id: 'tt', nhan: 'Ba đường trung trực', mau: '#16A34A', hien: laNgoai, ghiChu: 'Tâm đường tròn ngoại tiếp là <b>giao điểm ba đường trung trực</b> của tam giác.' },
    { id: 'dtN', nhan: 'Đường tròn ngoại tiếp', mau: MDT, hien: laNgoai, ghiChu: function (P) { var l = loai(P); return 'Đường tròn đi qua <b>ba đỉnh</b> của tam giác là đường tròn ngoại tiếp tam giác.' + (l === 'vuong' ? ' <b>Tam giác vuông: tâm là trung điểm cạnh huyền</b>, $R = \\dfrac{\\text{cạnh huyền}}{2}$.' : l === 'deu' ? ' <b>Tam giác đều cạnh $a$: $R = \\dfrac{a\\sqrt{3}}{3}$</b>.' : l === 'tu' ? ' Tam giác tù: tâm nằm ngoài tam giác.' : ''); } },
    { id: 'R', nhan: 'Bán kính OA = OB = OC', mau: MBK, hien: laNgoai, ghiChu: function (P) { var O = H.ngoaiTiep(P.A, P.B, P.C); return O ? '$R = OA = OB = OC \\approx ' + soL(H.dai(O, P.A)) + '$ cm.' : ''; } },
    { id: 'pg', nhan: 'Ba đường phân giác', mau: '#16A34A', hien: laNoi, ghiChu: 'Tâm đường tròn nội tiếp là <b>giao điểm ba đường phân giác trong</b> của tam giác.' },
    { id: 'dtI', nhan: 'Đường tròn nội tiếp', mau: MDT, hien: laNoi, ghiChu: function (P) { return 'Đường tròn <b>tiếp xúc với ba cạnh</b> của tam giác là đường tròn nội tiếp tam giác.' + (loai(P) === 'deu' ? ' <b>Tam giác đều cạnh $a$: $r = \\dfrac{a\\sqrt{3}}{6}$</b> ($= \\dfrac{R}{2}$).' : ''); } },
    { id: 'r', nhan: 'Bán kính r (IK ⊥ BC)', mau: MBK, hien: laNoi, ghiChu: function (P) { var r = 2 * H.dienTich([P.A, P.B, P.C]) / (H.dai(P.A, P.B) + H.dai(P.B, P.C) + H.dai(P.C, P.A)); return '$r$ = khoảng cách từ $I$ đến mỗi cạnh $\\approx ' + soL(r) + '$ cm.'; } },
  ],

  ve: function (g, P, ts) {
    var A = P.A, B = P.B, C = P.C, G = H.trongTam(A, B, C);
    g.daGiac([A, B, C], { to: '#93C5FD', doMoTo: 0.22, rong: 2.8 });
    if (ts.che === 'ngoai') {
      var O = H.ngoaiTiep(A, B, C);
      if (O) {
        if (g.bat('tt')) [[B, C], [C, A], [A, B]].forEach(function (c, i) {
          var m = H.trung(c[0], c[1]), d = H.tru(c[1], c[0]), L = Math.hypot(d[0], d[1]), n = [-d[1] / L, d[0] / L], tO = (O[0] - m[0]) * n[0] + (O[1] - m[1]) * n[1];
          g.doan(H.cong(m, H.nhan(n, Math.min(0, tO) - 0.8)), H.cong(m, H.nhan(n, Math.max(0, tO) + 0.8)), { mau: '#16A34A', rong: 2 });
          g.goc(H.cong(m, H.nhan(n, 1)), m, c[1], { mau: '#16A34A', r: 10, to: false }); g.kyHieu(c[0], m, i + 1, '#16A34A'); g.kyHieu(m, c[1], i + 1, '#16A34A');
        });
        if (g.bat('dtN')) g.duongTron(O, H.dai(O, A), { sang: 'dtN', to: MDT, doMoTo: 0.06 });
        if (g.bat('R')) [A, B, C].forEach(function (V) { g.doan(O, V, { mau: MBK, rong: 3, kyHieu: 1 }); });
        g.diem(O, 'O', { r: 5, mau: MO, huong: [0.8, 0.8] });
      }
    } else {
      var I = H.noiTiep(A, B, C), r = 2 * H.dienTich([A, B, C]) / (H.dai(A, B) + H.dai(B, C) + H.dai(C, A));
      if (g.bat('pg')) [[A, B, C], [B, C, A], [C, A, B]].forEach(function (x, i) {
        var D = chanPG(x[0], x[1], x[2]); g.doan(x[0], D, { mau: '#16A34A', rong: 2 });
        g.goc(x[1], x[0], D, { mau: '#16A34A', r: 26, kyHieu: i + 1, nhan: false, doMoTo: 0.12 }); g.goc(D, x[0], x[2], { mau: '#16A34A', r: 26, kyHieu: i + 1, nhan: false, doMoTo: 0.12 });
      });
      if (g.bat('dtI')) g.duongTron(I, r, { sang: 'dtI', to: MDT, doMoTo: 0.1 });
      [[B, C], [C, A], [A, B]].forEach(function (c) { var K = H.chan(I, c[0], c[1]); g.diem(K, '', { r: 3.5, mau: MDT }); if (g.bat('r')) { g.doan(I, K, { mau: MBK, rong: 3, kyHieu: 1 }); g.goc(I, K, c[1], { mau: MBK, r: 10, to: false }); } });
      g.diem(I, 'I', { r: 5, mau: MI, huong: [0.5, 1] });
    }
    g.diem(A, 'A', { huong: H.tru(A, G) }); g.diem(B, 'B', { huong: H.tru(B, G) }); g.diem(C, 'C', { huong: H.tru(C, G) });
  },
  nhanXet: function (P, ts) {
    var l = loai(P), a = H.dai(P.B, P.C), ten = { deu: 'đều', vuong: 'vuông', tu: 'tù', nhon: 'nhọn' }[l];
    if (ts.che === 'ngoai') { var O = H.ngoaiTiep(P.A, P.B, P.C); return 'Tam giác ' + ten + ': $R \\approx \\mathbf{' + soL(O ? H.dai(O, P.A) : 0) + '}' + (l === 'deu' ? ' = \\dfrac{a\\sqrt{3}}{3} = \\dfrac{' + soL(a) + '\\sqrt{3}}{3}' : l === 'vuong' ? ' = \\dfrac{\\text{cạnh huyền}}{2}' : '') + '$' + GACH + 'Tam giác nào cũng có một và chỉ một đường tròn ngoại tiếp.'; }
    var r = 2 * H.dienTich([P.A, P.B, P.C]) / (H.dai(P.A, P.B) + a + H.dai(P.C, P.A));
    return 'Tam giác ' + ten + ': $r \\approx \\mathbf{' + soL(r) + '}' + (l === 'deu' ? ' = \\dfrac{a\\sqrt{3}}{6} = \\dfrac{' + soL(a) + '\\sqrt{3}}{6}' : '') + '$' + GACH + 'Tam giác nào cũng có một và chỉ một đường tròn nội tiếp; tâm luôn nằm trong tam giác.';
  },
  khungNhin: function (P, ts) { if (ts.che !== 'ngoai') return []; var O = H.ngoaiTiep(P.A, P.B, P.C); if (!O) return []; var R = H.dai(O, P.A); return R < 12 ? [[O[0] - R, O[1] - R], [O[0] + R, O[1] + R]] : []; },
});
</script>
</body>
</html>
